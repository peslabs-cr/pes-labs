<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detective de causas</title>
<style>
:root{--bg:#f6f7f9;--fg:#1b1f24;--card:#fff;--mut:#667085;--ac:#0a7d5a;--bd:#dde1e6;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c;--fg:#e8ebee;--card:#1d2328;--mut:#98a2b3;--ac:#34d399;--bd:#2c343b;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#14181c;--fg:#e8ebee;--card:#1d2328;--mut:#98a2b3;--ac:#34d399;--bd:#2c343b;--bad:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 8px}h2{font-size:17px;margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
button{font:inherit;font-size:13px;padding:9px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.main{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;font-size:15px;padding:12px;margin-top:10px}
.bub{display:flex;gap:8px;align-items:flex-start;margin:8px 0}.av{font-size:26px;background:var(--bg);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.tx{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px}.tx small{color:var(--mut);display:block;font-size:11px;margin-bottom:2px}
.top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.prob{background:var(--bg);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
.chain{margin:8px 0;font-size:13px;color:var(--mut);border-left:3px solid var(--ac);padding-left:8px}.chain div{margin:3px 0}
.tbar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.tbar div{height:100%;background:var(--ac)}
.opt{display:block;width:100%;text-align:left;margin-top:6px;padding:11px;animation:sl .2s}
@keyframes sl{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.07)}100%{transform:scale(1)}}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.mcard{text-align:center;font-weight:700;padding:8px;border-radius:10px;box-shadow:0 0 0 3px var(--ac);animation:pop .35s}.mcard.bad{box-shadow:0 0 0 3px var(--bad);animation:shk .35s}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:4px 6px;border-bottom:1px solid var(--bd)}
</style></head><body><main>
<h1>🕵️ Detective de causas</h1>
<div id="app"></div>
</main>
<script>
const $=id=>document.getElementById(id);
var AU=null;
function beep(f,d,t){try{AU=AU||new(window.AudioContext||window.webkitAudioContext)();if(AU.state=="suspended")AU.resume();const o=AU.createOscillator(),g=AU.createGain();o.type=t||"square";o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AU.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AU.currentTime+d);o.stop(AU.currentTime+d)}catch(e){}}
function tune(a){a.forEach((f,i)=>setTimeout(()=>beep(f,.14),i*110))}
const P={mgr:["Marta","Gerente de planta","👩‍💼"],qa:["Carlos","Ing. de Calidad","🧑‍🔬"],pe:["Lucía","Ing. de Procesos","👷‍♀️"],op:["Don Beto","Operador","🧑‍🏭"]};
function bub(k,t){return `<div class="bub"><div class="av">${P[k][2]}</div><div class="tx"><small>${P[k][0]} · ${P[k][1]}</small>${t}</div></div>`}
const sh=a=>[...a].sort(()=>Math.random()-.5);
const FA=["Hombre","Máquina","Método","Material"];
const CS=[
{e:"🎨",t:"Burbujas en la pintura",p:"El 8% de las piezas pintadas sale con burbujas.",w:[
["¿Por qué hay burbujas en la pintura?","Las piezas con burbujas salen del secado con humedad residual; la pintura y las boquillas están dentro de especificación.","Se pinta sobre piezas que aún conservan humedad del proceso anterior","Las boquillas de la pistola aplican demasiada pintura sobre cada pieza","La nueva fórmula de la pintura libera gases mientras se seca sobre la pieza"],
["¿Por qué quedan húmedas las piezas?","El tiempo de secado cumple la especificación y los operarios respetan el ciclo completo. El panel indica 140 °C y un termómetro recién calibrado midió 105 °C.","La temperatura real del horno es menor que la que muestra el panel","El tiempo de secado programado es demasiado corto para estas piezas","Los operarios sacan las piezas del horno antes de terminar el ciclo"],
["¿Por qué la temperatura real es menor que la del panel?","Una de las tres resistencias está quemada. El panel marca 140 °C sin cambios en el ajuste y el termómetro externo se calibró esta semana.","Una resistencia quemada no se refleja en el sensor que usa el panel de control","El operador baja la temperatura del panel para ahorrar energía eléctrica","El termómetro externo marca menos porque tiene un error de lectura"],
["¿Por qué nadie detectó la resistencia quemada?","El técnico lleva 6 años con este horno y hay repuestos disponibles, pero no hay registros de revisiones ni de verificación de temperatura en 12 meses.","No existe un plan de mantenimiento ni verificación periódica de la temperatura real","El técnico es nuevo y todavía no conoce bien el funcionamiento ni los riesgos del horno","El horno es tan antiguo que ya no existen repuestos para repararlo"]],
r:"No existe un plan de mantenimiento ni verificación periódica de la temperatura",f:2,a:["Crear un plan de mantenimiento preventivo y verificar la temperatura real en cada turno","Instalar una cámara que inspeccione todas las piezas al salir de la cabina de pintura","Aumentar en 20 minutos el tiempo de secado de todas las piezas que pasan por el horno"]},
{e:"🧪",t:"Rebabas en piezas plásticas",p:"El 6% de las piezas plásticas inyectadas sale con rebabas.",w:[
["¿Por qué salen rebabas?","El molde cierra con la fuerza correcta y su temperatura está en rango. Las rebabas aparecen en la junta del molde.","El plástico fundido es tan fluido que escapa por la junta","El molde cierra con menos fuerza porque falla el sistema hidráulico","La temperatura del molde es demasiado alta por un ajuste equivocado"],
["¿Por qué el plástico fluye tanto?","La receta y el secado de la resina no cambiaron y están registrados. Un ensayo de laboratorio midió que la resina tiene menos viscosidad que la especificada.","La resina tiene una viscosidad menor que la indicada en su especificación","El tornillo gira a más velocidad porque alguien modificó la receta de inyección","La resina absorbió humedad porque se omitió el secado previo"],
["¿Por qué la viscosidad es menor?","La resina se guardó en el almacén habitual y nadie la mezcló con material reciclado. El lote llegó el lunes y es el único con ese problema.","El lote nuevo que llegó del proveedor venía fuera de especificación de viscosidad","La resina se degradó por estar almacenada cerca de una fuente de calor","Alguien mezcló resina reciclada sin autorización en la tolva"],
["¿Por qué se usó un lote fuera de especificación?","El proveedor mantiene el mismo proceso y el mismo certificado. Calidad nunca revisa los certificados ni toma muestras de la resina al recibirla.","No hay inspección ni revisión del certificado al recibir el material en bodega","El proveedor cambió su proceso de fabricación y no avisó de ello a la planta","El lote se recibió un fin de semana con poco personal en bodega"]],
r:"No existe una inspección de recepción del material",f:3,a:["Inspeccionar la resina al recibirla con certificado y criterios de aceptación","Subir la presión de cierre del molde para evitar que el plástico escape por la junta","Asignar a un operario para recortar las rebabas a mano al final de cada ciclo de inyección"]},
{e:"🔩",t:"Tornillos faltantes",p:"El 3% de las unidades sale con un tornillo faltante.",w:[
["¿Por qué falta el tornillo?","La caja de tornillos siempre está llena. Los faltantes ocurren con operarios nuevos y antiguos por igual, y siempre en el paso 7.","Varios operarios omiten el paso 7 al ensamblar la unidad","La caja de tornillos se queda vacía antes de terminar el turno","El cliente pidió una versión con menos tornillos desde hace poco"],
["¿Por qué omiten el paso 7?","El paso 7 se agregó hace dos semanas con un cambio de diseño. Los operarios dicen que no sabían que existía y no tienen sobrecarga de trabajo.","No saben que existe: es un paso nuevo que falta en su hoja","Lo saltan para terminar más rápido porque quieren cumplir la meta","Están agotados por las horas extra que han trabajado estas semanas"],
["¿Por qué no está en la hoja de instrucciones?","El ingeniero comunicó el cambio de diseño solo en una reunión de pie. La impresora funciona y las hojas se imprimen cada lunes.","El cambio se comunicó solo de forma verbal y no se actualizó la hoja","La impresora de la línea no funcionaba cuando había que imprimir las hojas nuevas","La hoja de instrucciones es demasiado larga y se recortó el paso"],
["¿Por qué solo se comunicó de forma verbal?","No hay un procedimiento para cambios de diseño. Nadie capacitó a los operarios ni verificó que entendieran el cambio.","Nadie capacitó formalmente a los operarios ni verificó que lo hubieran entendido bien","Ingeniería tiene poco personal y no alcanza para documentar cada cambio","Los operarios no suelen preguntar cuando algo no les queda claro en el ensamble"]],
r:"Falta de capacitación formal y de verificación tras el cambio de diseño",f:0,a:["Actualizar la hoja, capacitar con verificación y agregar un conteo a prueba de errores","Llamar la atención a quienes olvidan el paso y vigilar más de cerca a todo el turno","Agregar un inspector al final de la línea para revisar cada unidad que salga ensamblada"]},
{e:"⚙️",t:"Paros en el empaque",p:"La línea de empaque se detiene 40 minutos por turno.",w:[
["¿Por qué se detiene la línea?","Los paros ocurren cuando el motor de la banda dispara su protección térmica. Hay cajas suficientes y no hay descansos fuera de horario.","El motor de la banda se sobrecalienta y se apaga por seguridad","Falta caja de cartón y la banda queda vacía por momentos","Los operarios extienden los descansos y detienen la banda a mano"],
["¿Por qué se sobrecalienta el motor?","El motor es nuevo, el ventilador funciona y la carga es la de diseño. Se escucha un chirrido en el rodamiento del lado de la banda.","El rodamiento está seco, genera mucha fricción y calienta todo el motor hasta apagarlo","El ventilador del motor no gira y por eso no enfría el equipo durante el turno","La banda arrastra más carga de la que soporta el motor"],
["¿Por qué el rodamiento está seco?","El plan de mantenimiento exige lubricar cada semana. En el último mes nadie registró la lubricación de este rodamiento.","No se está lubricando según lo que exige el plan de mantenimiento","El lubricante usado es de mala calidad y se evapora rápido","El rodamiento viene defectuoso de fábrica y pierde la grasa con la vibración"],
["¿Por qué no se lubrica?","El punto de lubricación está detrás de una guarda y requiere desarmar parte de la banda. No figura en ninguna ruta de mantenimiento.","El punto es difícil de alcanzar y no está en ninguna ruta de lubricación","Los técnicos de turno evitan las tareas de lubricación por pereza y falta de interés","El presupuesto de mantenimiento no alcanza para comprar suficiente grasa"]],
r:"El punto de lubricación es de difícil acceso y no está en ninguna ruta de mantenimiento",f:1,a:["Hacer accesible y etiquetar el punto, y agregarlo a la ruta semanal de lubricación","Instalar un ventilador extra para enfriar el motor durante los turnos largos","Cambiar el motor por uno de mayor potencia cada seis meses para evitar sobrecalentamiento"]},
{e:"🚚",t:"Pedidos entregados tarde",p:"El 15% de los pedidos se entrega tarde.",w:[
["¿Por qué se entregan tarde?","El transporte sale a tiempo y llega en el plazo prometido. Los pedidos esperan días antes de empezar a producirse.","Los pedidos esperan demasiado antes de empezar a producirse","El transporte tarda más de lo prometido en llegar hasta las instalaciones del cliente","Los clientes cambian sus pedidos a última hora con frecuencia"],
["¿Por qué esperan tanto?","Hay una cola enorme frente a la prensa, que es la máquina más lenta. Las demás máquinas pasan buena parte del tiempo esperando trabajo.","Se forma una cola de lotes grandes frente a la máquina cuello de botella","Los operarios de la prensa trabajan más despacio que el resto","Las máquinas posteriores se detienen con frecuencia por falta de mantenimiento preventivo"],
["¿Por qué se forma esa cola?","Producción libera lotes grandes cada lunes sin mirar la capacidad de la prensa. La plantilla está completa.","Se liberan lotes grandes cada lunes sin considerar la capacidad real del cuello de botella","Faltan operarios en la prensa para atender todos los lotes que se liberan cada lunes","Los lotes son grandes porque los clientes piden cantidades enormes"],
["¿Por qué se liberan así?","La programación se hace en una hoja de cálculo por fecha de entrega, sin calcular la capacidad real ni secuenciar según el cuello de botella.","No existe un método de programación basado en la capacidad real","La gerencia exige liberar todo el trabajo cada lunes sin excepción","El software de planificación es viejo y se cae con frecuencia"]],
r:"No hay un método de programación basado en la capacidad del cuello de botella",f:2,a:["Programar según la capacidad del cuello de botella y reducir el tamaño de cada lote","Pagar horas extra a todo el personal de planta para recuperar el atraso acumulado","Prometer plazos de entrega más largos para no quedar mal con clientes"]}];
const WHY={why:"Cada «porqué» debe explicar el anterior y ser coherente con los datos. Las otras opciones sonaban razonables, pero los datos las contradicen o no las respaldan.",fam:"Clasificar la causa en Hombre, Máquina, Método o Material ayuda a elegir la acción correcta.",act:"Las acciones sobre el síntoma (revisar más, reprocesar, reiniciar) no evitan que el defecto vuelva."};
let G,BEST=0;
function tmr(ms,end){clearInterval(G.tm);G.t0=Date.now();G.tl=ms;G.tm=setInterval(()=>{const f=1-(Date.now()-G.t0)/ms,b=$("tb");if(b){b.style.width=Math.max(0,f*100)+"%";b.style.background=f<.3?"#dc2626":""}if(f<=0){clearInterval(G.tm);end()}},100)}
const left=()=>G.tl?Math.max(0,1-(Date.now()-G.t0)/G.tl):0;
const TB=()=>`<div class="tbar" style="margin:8px 0"><div id="tb" style="width:${G.tl?left()*100:100}%"></div></div>`;
function home(){clearInterval(G&&G.tm);G={};
 $("app").innerHTML=`<div class="card"><h2>Encuentra la causa raíz antes de que el defecto vuelva</h2>${bub("mgr","Los defectos regresan una y otra vez porque solo se tapan los síntomas. Necesito que el equipo encuentre las causas raíz.")}${bub("qa","Usaremos los <b>5 porqués</b>: preguntamos «¿por qué?» varias veces y cada respuesta explica la anterior. Cada pregunta trae un <b>dato</b>: la respuesta correcta es la que concuerda con él, no la más larga ni la que suena mejor. Una buena respuesta se puede verificar y no culpa a personas. Después clasificamos la causa con Ishikawa y elegimos la acción.")}${bub("op","Yo les cuento lo que veo en la línea. Si se atoran, pídanme una pista, pero cuesta puntos. ¡Y hay poco tiempo por pregunta!")}<button class="main" onclick="start(1)">🟢 Empezar en Normal (3 casos)</button><button class="main" style="background:#b91c1c;border-color:#b91c1c" onclick="start(2)">🔴 Empezar en Experto (4 casos, menos tiempo y vidas)</button></div>`}
function start(l){G={lv:l,lives:l==2?2:3,pts:0,ok:0,tot:0,miss:[],ci:0,cs:sh(CS).slice(0,l==2?4:3)};nc()}
function mkq(q,o,c,k,d){const s=sh(o);return{q,o:s,i:s.indexOf(c),k,d}}
function nc(){if(G.ci>=G.cs.length)return fin();const c=G.cs[G.ci];
 G.st=[...c.w.map(x=>mkq(x[0],[x[2],x[3],x[4]],x[2],"why",x[1])),mkq("Según Ishikawa, esa causa raíz pertenece a la familia…",FA,FA[c.f],"fam"),mkq("¿Qué acción corrige la causa raíz y no solo el síntoma?",c.a,c.a[0],"act")];
 G.si=0;G.ch=[];G.hid=[];G.used=0;G.intro=1;rs()}
function rs(){G.tl=0;rd();tmr(G.lv==2?30000:50000,()=>ans(-1))}
function rd(){const c=G.cs[G.ci],s=G.st[G.si];
 $("app").innerHTML=`<div class="card"><div class="top"><span>Caso ${G.ci+1} de ${G.cs.length}</span><span>${"❤️".repeat(G.lives)}</span><b>${G.pts} pts</b></div><h2>${c.e} ${c.t}</h2>${G.intro?bub("op","Jefe, tenemos un problema: <b>"+c.p+"</b>"):`<div class="prob"><b>Problema:</b> ${c.p}</div>`}${G.ch.length?`<div class="chain">${G.ch.map((x,i)=>`<div>${i<4?"¿Por qué? → ":"→ "}${x}</div>`).join("")}</div>`:""}${s.d?`<div class="prob" style="border-left:3px solid #d97706">📋 <b>Dato:</b> ${s.d}</div>`:""}${TB()}<p style="margin:8px 0 2px"><b>Pregunta ${G.si+1} de 6 · ${s.q}</b></p>${s.o.map((o,i)=>`<button class="opt" ${G.hid.includes(i)?"disabled":""} onclick="ans(${i})">${o}</button>`).join("")}<button style="width:100%;margin-top:8px" ${G.used||s.k=="fam"?"disabled":""} onclick="hint()">🧑‍🏭 Pista de Don Beto (−30 pts)</button></div>`}
function hint(){const s=G.st[G.si],w=s.o.map((_,i)=>i).filter(i=>i!=s.i&&!G.hid.includes(i));if(G.used||!w.length)return;G.hid.push(w[Math.random()*w.length|0]);G.used=1;G.pts=Math.max(0,G.pts-30);beep(400,.08);rd()}
function ans(i){clearInterval(G.tm);const c=G.cs[G.ci],s=G.st[G.si],ok=i==s.i,bn=Math.round(left()*50);G.tot++;let g=0;
 if(ok){G.ok++;g=Math.max(0,100+bn-(G.used?30:0));G.pts+=g;tune([523,659])}else{G.lives--;G.miss.push(c.t+" · "+s.q);beep(120,.15,"sawtooth")}
 G.ch.push(s.o[s.i]);const last=G.si==5,over=G.lives<=0;
 $("app").innerHTML=`<div class="card"><div class="top"><span>Caso ${G.ci+1} de ${G.cs.length}</span><span>${"❤️".repeat(Math.max(0,G.lives))}</span><b>${G.pts} pts</b></div><div class="mcard ${ok?"":"bad"}">${ok?"✅ Correcto +"+g:i<0?"⏰ Se acabó el tiempo":"❌ No era esa"}</div>${bub("qa",(ok?"":"La respuesta correcta era: <b>"+s.o[s.i]+"</b>. ")+WHY[s.k])}${s.d?`<div class="prob">📋 ${s.d}</div>`:""}${G.si==3?bub("mgr","🎯 Causa raíz: <b>"+c.r+"</b>"):""}${last?`<div class="chain"><div><b>Problema:</b> ${c.p}</div>${G.ch.slice(0,4).map(x=>`<div>¿Por qué? → ${x}</div>`).join("")}<div>🎯 Raíz: ${c.r}</div><div>Familia: ${FA[c.f]}</div><div>Acción: ${c.a[0]}</div></div>`:""}<button class="main" onclick="nx()">${over||(last&&G.ci==G.cs.length-1)?"Ver resultado":last?"Siguiente caso →":"Continuar →"}</button></div>`}
function nx(){if(G.lives<=0)return fin();if(G.si==5){G.ci++;return nc()}G.si++;G.hid=[];G.used=0;rs()}
function fin(){clearInterval(G.tm);const acc=G.tot?G.ok/G.tot:0;let s=acc>=.9?3:acc>=.75?2:acc>=.55?1:0;if(G.lives<=0)s=Math.min(s,1);BEST=Math.max(BEST,G.pts);
 const solved=G.lives>0?G.cs.length:G.ci,u=[...new Set(G.miss)].slice(0,6);if(s>=2)tune([523,659,784,1047]);
 $("app").innerHTML=`<div class="card"><h2>${G.lives<=0?"💥 Sin vidas: investigación cerrada":"🏁 Investigación terminada"} · ${G.lv==2?"🔴 Experto":"🟢 Normal"}</h2><div style="font-size:26px">${"⭐".repeat(s)}${"☆".repeat(3-s)}</div><p>Casos resueltos: <b>${solved}/${G.cs.length}</b> · Aciertos: <b>${G.ok}/${G.tot}</b> (${Math.round(acc*100)}%) · Puntaje: <b>${G.pts}</b> <small style="color:var(--mut)">(mejor de la sesión: ${BEST})</small></p>${bub("mgr",s>=2?"¡Excelente! Ahora los defectos no volverán, porque atacamos la causa y no el síntoma.":"Buen intento. Recuerden: cada «porqué» explica el anterior, y la acción debe eliminar la causa raíz.")}${u.length?`<p style="margin:6px 0 4px"><b>Para repasar</b></p><table>${u.map(x=>`<tr><td>${x}</td></tr>`).join("")}</table>`:"<p>🎉 ¡Sin errores!</p>"}<button class="main" onclick="home()">🔄 Jugar de nuevo</button></div>`}
home();
</script></body></html>
