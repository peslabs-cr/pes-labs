 {id:"kev3",who:"kevin",kind:"high",req:S=>S.turn>=6,text:"Kevin detectó un patrón raro en la oblea de prueba y paró la herramienta antes de correr el lote completo.",
  L:{t:"Felicitarlo y reportar el hallazgo con su nombre",fx:{y:9,e:4},tr:{kevin:8},tag:"protege",r:"Ingeniería encontró una lámpara degradada. Habría arruinado 25 obleas."},
  R:{t:"Pedirle que la próxima vez te consulte antes de parar",fx:{y:6,p:2},tr:{kevin:-10},tag:"impone",r:"Tiene sentido: parar cuesta. Pero Kevin entendió otra cosa: que mejor no parar."}},
 {id:"kev_low",who:"kevin",kind:"low",text:"Kevin corrió un lote con la receta equivocada. No preguntó porque «no quería molestar». 25 obleas a revisión.",
  pre:{y:-10},
  L:{t:"Buscar al responsable y documentarlo",fx:{g:2,e:-5},tr:{kevin:-8},tag:"expone",r:"Kevin firmó el reporte temblando."},
  R:{t:"Revisar con él qué faltó en su entrenamiento",fx:{p:-3,y:3},tr:{kevin:12},tag:"explica",r:"Nadie le había explicado cómo verificar la receta en el sistema."}},
// ---------- Don Chepe ----------
 {id:"che1",who:"chepe",kind:"arc",req:S=>S.turn>=1,text:"«Otro procedimiento nuevo… El anterior funcionaba. Esto lo inventaron en una oficina sin entrar a la bahía.»",
  L:{t:"«Es la instrucción, Don Chepe, hay que seguirla»",fx:{y:2},tr:{chepe:-8},tag:"impone",r:"Lo siguió. Sin decir nada más."},
  R:{t:"Pedirle que lo revise contigo y te diga qué ve mal",fx:{p:-3},tr:{chepe:12},tag:"escucha",set:"che_rev",sch:[["che2",2]],r:"Se quedó mirando el documento un buen rato."}},
 {id:"che2",who:"chepe",kind:"sched",req:S=>S.f.che_rev,text:"Don Chepe encontró que el paso 7 del procedimiento nuevo deja la oblea expuesta mientras se cambia el cassette.",
  L:{t:"Llevar el hallazgo a ingeniería con su nombre",fx:{y:9,g:3},tr:{chepe:15},tag:"protege",r:"Ingeniería corrigió el procedimiento y lo llamó a la reunión."},
  R:{t:"Llevarlo tú, para que ingeniería lo tome más en serio",fx:{y:9,g:8},tr:{chepe:-12},tag:"resuelve",r:"Lo tomaron en serio. Don Chepe se enteró por otro compañero."}},
 {id:"che3",who:"chepe",kind:"high",req:S=>S.turn>=5,text:"«Jefe, el muchacho nuevo tiene buena mano. Si me da una hora a la semana, yo lo entreno en la alineación.»",
  L:{t:"«Gracias, pero el entrenamiento lo da el departamento»",fx:{},tr:{chepe:-10},tag:"resuelve",r:"Tienes razón en lo formal. Don Chepe no volvió a ofrecer."},
  R:{t:"Aceptar y reorganizar el turno para darles esa hora",fx:{p:-4,y:5,e:3},tr:{chepe:10,kevin:10},tag:"delega",set:"mentor",r:"Dos semanas después, Kevin alineaba solo."}},
 {id:"che_low",who:"chepe",kind:"low",text:"Don Chepe vio desde ayer que el vacío de la cámara venía bajando. No dijo nada. «¿Para qué, si nadie escucha?»",
  pre:{y:-9},
  L:{t:"Llamarle la atención por no reportar",fx:{g:2,e:-3},tr:{chepe:-6},tag:"impone",r:"Tienes razón en la norma. Él tiene razón en lo otro."},
  R:{t:"Reconocer que no lo has escuchado y pedirle ayuda",fx:{p:-1},tr:{chepe:14},tag:"escucha",r:"«Bueno… le cuento lo que veo», dijo."}},
// ---------- Mariela ----------
 {id:"mar1",who:"mariela",kind:"arc",req:S=>S.turn>=2,text:"Mariela te enseña un dibujo: reordenar el cuarto de cassettes para caminar menos. «Lo hice en mi casa.»",
  L:{t:"«Buena idea, mándala por el buzón de sugerencias»",fx:{},tr:{mariela:-8},tag:"numero",r:"El buzón responde en tres meses. Mariela lo sabe."},
  R:{t:"Probarla con ella en el siguiente turno",fx:{p:-4,e:2},tr:{mariela:12},tag:"escucha",set:"mar_idea",sch:[["mar2",2]],r:"Perdieron una hora moviendo estantes."}},
 {id:"mar2",who:"rojas",kind:"sched",req:S=>S.f.mar_idea,text:"«El tiempo de espera de los lotes bajó 12 % en tu cuadrilla. ¿Quién hizo eso?»",
  L:{t:"«Lo trabajamos en equipo»",fx:{p:6,g:5},tr:{mariela:-6},tag:"resuelve",r:"Es cierto en parte. Mariela estaba escuchando."},
  R:{t:"«Fue idea de Mariela; yo solo la apoyé»",fx:{p:6,g:3,e:4},tr:{mariela:15},tag:"protege",set:"mar_known",r:"El gerente anotó su nombre."}},
 {id:"mar3",who:"mariela",kind:"high",req:S=>S.turn>=8,text:"Hay una vacante de líder de línea. Mariela aplicaría si tú la recomiendas, pero perderías a tu mejor operadora.",
  L:{t:"Recomendarla",fx:{p:-5,e:6,g:2},tr:{mariela:10},tag:"delega",set:"mar_promo",r:"Mariela fue seleccionada. Antes de irse, entrenó a Andrés en su puesto."},
  R:{t:"Pedirle que espere unos meses",fx:{p:4},tr:{mariela:-15},tag:"numero",r:"La cuadrilla sigue fuerte. Mariela ya no trae su libreta."}},
 {id:"mar_low",who:"mariela",kind:"low",text:"Mariela ya no propone nada. Hoy oíste que le dijo a Kevin: «No pierdas el tiempo con ideas, aquí nadie las prueba».",
  L:{t:"No meterte: es su opinión",fx:{e:-4},tr:{mariela:-3},tag:"numero",r:"Kevin dejó de anotar sus ideas."},
  R:{t:"Pedirle una idea, solo una, y probarla esta semana",fx:{p:-3,e:2},tr:{mariela:14},tag:"escucha",r:"«¿En serio?», preguntó. Al día siguiente trajo tres."}},
// ---------- Luis ----------
 {id:"lui1",who:"luis",kind:"arc",req:S=>S.turn>=1,text:"Luis va adelante en la meta del día. Ves que se saltó la verificación de partículas de la bandeja para ganar 5 minutos.",
  L:{t:"Dejarlo pasar: hoy la meta está apretada",fx:{p:6,y:-3},tr:{luis:4},tag:"numero",set:"lui_skip",sch:[["lui2a",2]],r:"Ganaste 5 minutos. Todos lo vieron."},
  R:{t:"Detenerlo y explicarle qué hace una partícula en una oblea",fx:{p:-3,y:4},tr:{luis:-3},tag:"explica",set:"lui_ok",sch:[["lui2b",3]],r:"«Está bien, jefe», con cara de fastidio."}},
 {id:"lui2a",who:"paula",kind:"sched",req:S=>S.f.lui_skip,text:"«Un lote de la cuadrilla salió con defectos por partículas. Fue uno de los que corrió Luis. Hay 50 obleas en revisión.»",
  pre:{y:-9},
  L:{t:"Sancionarlo por escrito",fx:{g:3,e:-4},tr:{luis:-12},tag:"expone",r:"Luis firmó. «Pero usted me vio y no dijo nada.»"},
  R:{t:"Admitir que tú lo dejaste pasar y revisar juntos el método",fx:{g:-3,e:4},tr:{luis:10},tag:"protege",r:"Te costó con calidad. Luis no volvió a saltarse la verificación."}},
 {id:"lui2b",who:"luis",kind:"sched",req:S=>S.f.lui_ok,text:"«Jefe, medí el tiempo. La verificación toma 5 minutos, pero se puede hacer mientras la herramienta calienta.»",
  L:{t:"«Hagámoslo como dice el procedimiento»",fx:{y:1},tr:{luis:-6},tag:"impone",r:"Luis volvió a su puesto. Ya no midió nada más."},
  R:{t:"Validarlo con calidad y probarlo",fx:{p:6},tr:{luis:12},tag:"escucha",set:"lui_idea",r:"Calidad lo aprobó. Ahora es el estándar de las tres cuadrillas."}},
 {id:"lui_low",who:"luis",kind:"low",text:"Luis anda diciendo en el comedor que «este supervisor no sabe lo que es producir».",
  L:{t:"Confrontarlo frente a los que lo escucharon",fx:{e:-6},tr:{luis:-8},tag:"expone",r:"Ganaste la discusión. Perdiste a Luis."},
  R:{t:"Invitarlo a un café y preguntarle qué haría él distinto",fx:{p:-1},tr:{luis:14},tag:"escucha",r:"Te dio dos ideas buenas y una mala. Le agradeciste las tres."}},
// ---------- Andrés ----------
 {id:"and1",who:"andres",kind:"arc",req:S=>S.turn>=2,text:"Andrés casi nunca habla. Al final del arranque murmura algo que no alcanzas a oír.",
  L:{t:"Seguir: el tiempo se acabó",fx:{p:1},tr:{andres:-6},tag:"numero",r:"Cada quien a su puesto."},
  R:{t:"Acercarte y preguntarle qué dijo",fx:{p:-1},tr:{andres:10},tag:"escucha",set:"and_warn",sch:[["and2",1]],r:"«La bomba de la grabadora 3 suena distinto desde ayer.»"}},
 {id:"and2",who:"beto",kind:"sched",req:S=>S.f.and_warn,text:"«Revisé la bomba de la grabadora 3. Tiene un rodamiento gastado. Puedo cambiarlo hoy, pero hay que parar 3 horas.»",
  L:{t:"Esperar al mantenimiento programado del viernes",fx:{p:4},set:"bomba",sch:[["and3",2]],tag:"numero",r:"La grabadora sigue corriendo."},
  R:{t:"Parar hoy y cambiarlo",fx:{p:-8,y:5,g:-2},tr:{andres:8},tag:"escucha",r:"Tres horas perdidas. Beto te enseñó el rodamiento: estaba a punto de romperse."}},
 {id:"and3",who:"rojas",kind:"sched",req:S=>S.f.bomba,text:"«La bomba de la grabadora 3 falló en pleno lote. Seis horas fuera de servicio y 25 obleas perdidas. ¿Nadie lo vio venir?»",
  pre:{p:-10,y:-8},
  L:{t:"«Andrés lo reportó; fue mi decisión esperar»",fx:{g:-4},tr:{andres:8},tag:"protege",r:"El gerente apreció que no buscaras excusas."},
  R:{t:"«Estaba programado para el viernes»",fx:{g:-6},tr:{andres:-10},tag:"resuelve",r:"Andrés escuchó. Pensó que su aviso no había servido de nada."}},
 {id:"and4",who:"andres",kind:"arc",req:S=>S.turn>=4,text:"Andrés y Luis discuten fuerte en el vestidor por un cambio de turno. Hay compañeros mirando.",
  L:{t:"Decirles que lo arreglen fuera del trabajo",fx:{e:-5},tr:{andres:-6,luis:-4},tag:"impone",r:"Se callaron. El problema siguió."},
  R:{t:"Separarlos y hablar con cada uno por aparte",fx:{p:-3,e:3},tr:{andres:7,luis:5},tag:"escucha",r:"Era un malentendido con el rol de vacaciones. Lo arreglaron en 10 minutos."}},
 {id:"and_low",who:"andres",kind:"low",text:"Andrés escuchó un ruido raro en la grabadora y no dijo nada. Se dañó un lote.",
  pre:{y:-8},
  L:{t:"Recordarle que reportar es su obligación",fx:{e:-2},tr:{andres:-5},tag:"impone",r:"«Sí, jefe.»"},
  R:{t:"Preguntarle por qué no te avisó",fx:{},tr:{andres:12},tag:"escucha",r:"«Una vez avisé y nadie hizo nada.»"}},
// ---------- Gerencia y otros ----------
 {id:"g1",who:"rojas",kind:"pool",text:"«El cliente adelantó el pedido. Necesito 10 % más de producción esta semana.»",
  L:{t:"Aceptar sin discutir",fx:{p:8,g:9,y:-5,e:-7},tag:"numero",r:"El gerente quedó contento. La cuadrilla, agotada."},
  R:{t:"Negociar 5 % y explicarle qué se arriesga con más",fx:{p:4,g:-3,e:3},tag:"protege",r:"Aceptó a regañadientes. Te pidió los datos para la próxima vez."}},
 {id:"g2",who:"rojas",kind:"pool",text:"«Quiero la lista de los operadores con más errores del mes. Vamos a hablar con ellos.»",
  L:{t:"Entregar la lista",fx:{g:6,e:-9},trAll:-5,tag:"expone",r:"La lista llegó. También el rumor."},
  R:{t:"Proponer analizar las causas de los errores, no a las personas",fx:{g:-4,y:4,e:5},tag:"protege",r:"Encontraron que 6 de 10 errores venían de la misma pantalla confusa."}},
 {id:"g3",who:"paula",kind:"pool",text:"«Hay una excursión de partículas en la bahía de litografía. Si paramos para limpiar, perdemos el resto del turno.»",
  L:{t:"Seguir corriendo con monitoreo extra",fx:{p:4,y:-9},tag:"numero",r:"El turno se salvó. El rendimiento de la semana, no tanto."},
  R:{t:"Parar y limpiar",fx:{p:-11,y:8,g:-3},tag:"explica",r:"Perdieron el turno. El lote siguiente salió limpio."}},
 {id:"g4",who:"rrhh",kind:"pool",text:"«Hay presupuesto para una sola capacitación este mes: control estadístico para tu cuadrilla, o un curso de liderazgo para ti.»",
  L:{t:"Curso de liderazgo para mí",fx:{g:4},tag:"resuelve",r:"Buen curso. Lo primero que enseñaron fue a invertir en tu equipo."},
  R:{t:"Control estadístico para la cuadrilla",fx:{p:-4,y:6,e:4},trAll:3,tag:"delega",r:"Ahora Sofía lee las gráficas mejor que tú."}},
 {id:"g5",who:"beto",kind:"pool",text:"«Le puedo hacer el mantenimiento preventivo a la herramienta 2 hoy o el lunes. Hoy pierden tres horas.»",
  L:{t:"El lunes",fx:{p:4,y:-4},tag:"numero",r:"Hoy salió todo. El lunes ya veremos."},
  R:{t:"Hoy",fx:{p:-7,y:5},tag:"explica",r:"Beto encontró un sello desgastado."}},
 {id:"g6",who:"rojas",kind:"pool",req:S=>S.turn>=4,text:"«Me dicen que tu arranque de turno dura 10 minutos. Los otros supervisores tardan 5.»",
  L:{t:"Volver a 5 minutos",fx:{g:5,e:-4},tag:"numero",r:"Cumples la norma. Pierdes tu mejor momento con la gente."},
  R:{t:"Mostrarle con datos qué ganaste con esos 5 minutos extra",fx:{},pv:{g:6},tag:"explica",fn:S=>{const ok=S.m.y>=55;S.m.g+=ok?6:-6;return ok?"Los datos te respaldaron: el gerente pidió que otros lo prueben.":"Tus datos no eran convincentes todavía. El gerente no quedó contento."},r:""}},
 {id:"g7",who:"noche",kind:"pool",text:"«Perdón, mae. Anoche nos llovió todo: les dejé la bahía desordenada y sin registros.»",
  L:{t:"Reportarlo a la gerencia",fx:{g:3,e:-2},tag:"expone",r:"El supervisor de noche ya no te pasa información."},
  R:{t:"Ayudarle a ordenar y acordar cómo entregar el turno",fx:{p:-3,e:2},tag:"protege",set:"noche_ok",r:"Desde entonces, las entregas de turno vienen completas."}},
 {id:"g8",who:"rojas",kind:"pool",text:"«Cumplieron la meta del mes. ¿Qué quieres hacer para reconocerlo?»",
  L:{t:"Pedir que lo mencione en el boletín de la planta",fx:{g:4,e:3},tag:"numero",r:"Salió una línea en el boletín."},
  R:{t:"Pedirle que baje a la bahía a decírselo en persona",fx:{g:2,e:8},trAll:3,tag:"protege",r:"El gerente bajó con el traje mal puesto. A todos les encantó."}},
 {id:"g9",who:"paula",kind:"pool",text:"«Detectamos que la prueba de pulseras antiestáticas se está firmando sin hacerla. ¿Sabías?»",
  L:{t:"Reunir a la cuadrilla y advertir que habrá sanciones",fx:{y:4,e:-6},tag:"impone",r:"Ahora todos la hacen. Por miedo."},
  R:{t:"Hacer la prueba con ellos y explicar qué le hace la estática a un chip",fx:{p:-2,y:5,e:2},tag:"explica",r:"Andrés no sabía que una descarga invisible podía matar un chip."}},
 {id:"g10",who:"rojas",kind:"pool",req:S=>S.turn>=6,text:"«Necesito prestarle a Luis a la otra cuadrilla por dos semanas.»",
  L:{t:"Aceptar: es lo que la planta necesita",fx:{g:6,p:-6},tr:{luis:-4},tag:"numero",r:"Luis se fue molesto. A tu cuadrilla le costó."},
  R:{t:"Proponer a Kevin, que necesita aprender otras herramientas",fx:{g:2,p:-2},tr:{kevin:5},tag:"delega",r:"Kevin volvió con ideas nuevas. Luis siguió en su puesto."}},
 {id:"g11",who:"paula",kind:"pool",text:"«Una oblea salió con un defecto que nunca había visto. Necesito a alguien de tu cuadrilla una hora para investigarlo.»",
  L:{t:"Ir tú: así no pierdes a nadie de la línea",fx:{y:3},tag:"resuelve",r:"Lo resolviste tú. Nadie en la cuadrilla aprendió nada."},
  R:{t:"Mandar a Sofía, que es la mejor encontrando defectos",fx:{p:-3,y:5},tr:{sofia:8},tag:"delega",r:"Sofía encontró la causa en 40 minutos."}},
 {id:"g12",who:"rrhh",kind:"pool",req:S=>S.turn>=3,text:"«En la encuesta de clima, tu cuadrilla dice que no recibe reconocimiento.»",
  L:{t:"«Les pago para que trabajen bien»",fx:{e:-6},trAll:-3,tag:"numero",r:"Laura anotó algo en su libreta."},
  R:{t:"Pedir los comentarios exactos y hablarlo con la cuadrilla",fx:{e:5},trAll:3,tag:"escucha",r:"Era más simple de lo que creías: querían saber si lo que hacían servía."}},
 {id:"g13",who:"beto",kind:"pool",text:"«La grabadora 1 está dando alarmas intermitentes. No sé qué es. Puede ser nada.»",
  L:{t:"Seguir y monitorear",fx:{p:3},pv:{y:4},fn:S=>{if(S.trustAvg()>=60){S.m.y+=2;return"Andrés y Don Chepe la estuvieron vigilando sin que se los pidieras. Era un sensor sucio."}S.m.y-=6;return"Nadie la vigiló. La alarma era real y se perdió un lote."},r:""},
  R:{t:"Pedir a la cuadrilla que anote cada alarma con la hora",fx:{p:-2,y:4},trAll:2,tag:"delega",r:"Con los registros, Beto encontró el patrón en una hora."}},
 {id:"g14",who:"rojas",kind:"pool",req:S=>S.turn>=7,text:"«Hay una plaza de supervisor senior en otra área. Te recomendaría, pero tendrías que dejar tu cuadrilla en dos semanas.»",
  L:{t:"Aceptar la oportunidad",fx:{g:8,e:-5},tag:"resuelve",set:"leaving",r:"Tu cuadrilla se enteró por los pasillos."},
  R:{t:"Pedir tiempo para preparar a alguien de la cuadrilla que te reemplace",fx:{g:3,e:4},trAll:3,tag:"delega",r:"El gerente lo pensó: «Eso es lo que hace un líder»."}},
 {id:"g15",who:"paula",kind:"pool",text:"«En la auditoría de mañana van a entrevistar a operadores. ¿Los preparas?»",
  L:{t:"Darles las respuestas que deben decir",fx:{g:3,y:-2},tag:"impone",r:"Respondieron de memoria. El auditor lo notó."},
  R:{t:"Repasar con ellos por qué se hace cada control",fx:{p:-3,y:4,g:4},trAll:2,tag:"explica",r:"Kevin le explicó al auditor la verificación de receta. Sin papel."}}];

 {id:"cr_esc2",who:"rojas",kind:"sched",req:S=>S.f.esc_hide,pre:{g:-18,y:-10},text:"«El cliente encontró chips fallando en su ensamble. Rastrearon los lotes hasta nosotros… y descubrieron que ya lo sabíamos. Viene una auditoría.»",

 {id:"cr_cut",who:"rojas",kind:"crisis",text:"«Bajó la demanda. Tengo que sacar a una persona de tu cuadrilla esta semana. O la escoges tú, o la escojo yo con los números.»",

 const ppl=Object.keys(PEOPLE).map(p=>{const d=S.tr[p]-S.t0.tr[p];if(S.gone[p])return S.notes.some(n=>n.startsWith(PEOPLE[p].n+" se fue"))?`<div class="row"><div class="av">${por(p,"s")}</div><div><b>${PEOPLE[p].n}</b> <span class="dn">se fue de la cuadrilla</span></div></div>`:"";return d?`<div class="row"><div class="av" style="border-color:${tcol(S.tr[p])}">${por(p,d>0?"h":"s")}</div><div style="flex:1"><b>${PEOPLE[p].n}</b> <span class="${d>0?"up":"dn"}">${d>0?"▲ confía más en ti":"▼ confía menos en ti"}</span><div class="bar"><i style="width:${S.tr[p]}%;background:${tcol(S.tr[p])}"></i></div></div></div>`:""}).join("");
 const pas=(pv.warn?`<p>🙋 ${pv.warn===1?"Una persona que confía en ti te avisó":pv.warn+" personas que confían en ti te avisaron"} de un problema pequeño antes de que creciera.</p>`:"")+(pv.auto?`<p>⚙️ La cuadrilla resolvió ${pv.auto>=5?"varios problemas":"un problema"} sin que tuvieras que intervenir. Eso también es producción.</p>`:"")+(pv.blind?`<p>🙈 ${pv.blind===1?"Alguien vio algo raro y no te lo dijo":pv.blind+" personas vieron cosas raras y no te las dijeron"}.</p>`:"");
 openD(`<span class="tag">${when()}</span><h2>Fin del turno</h2><div class="grid4">${rows}</div>${ppl?`<h3>Tu cuadrilla</h3>${ppl}`:""}${pas}<h3>Lo que pasó</h3>${S.notes.map(n=>`<p class="mut">• ${n}</p>`).join("")}
 <button class="btn" onclick="${S.turn>=TURNS?"S.done=true;save();endGame()":"closeD();newTurn()"}">${S.turn>=TURNS?"Ver tu espejo ▶":"Siguiente turno ▶"}</button>`)}
const WEEK={1:["Semana 1 · Conoce a tu cuadrilla","Te acaban de asignar la cuadrilla A de fotolitografía. Son seis personas, cada una con su historia. Tú todavía no sabes cuál es."],
 5:["Semana 2 · Lo que sembraste","Lo que decidiste la semana pasada empieza a volver. Algunas personas ya te cuentan cosas. Otras, ya no."],
 9:["Semana 3 · El equipo sin ti","Esta semana se nota si la cuadrilla depende de ti… o si ya sabe qué hacer sola."]};
function weekDlg(){const w=WEEK[S.turn];openD(`<span class="tag">Fab PES · Fotolitografía · Turno A</span><h2>${w[0]}</h2><p>${w[1]}</p><button class="btn" onclick="closeD();showCard()">Empezar el turno ▶</button>`)}
// ---------- espejo ----------
const STY={mixto:["🧭 El líder en construcción","A veces escuchas y explicas; otras veces mandas o resuelves solo. Tu equipo todavía no sabe qué esperar de ti.","Fortaleza: sabes adaptarte a la situación.","Riesgo: sin un estilo claro, la gente no sabe si contarte las cosas o guardárselas."],
 forma:["🌱 El que forma gente","Explicas el porqué y das espacio para que otros enseñen. Tu cuadrilla aprende de ti y entre ellos.","Fortaleza: tu equipo crece y puede funcionar sin ti.","Riesgo: formar toma tiempo, y a veces la gerencia quiere resultados para ayer."],
 cuida:["🤝 El que cuida a su gente","Escuchas, proteges y das la cara por tu equipo. La gente confía en ti y te cuenta lo que ve.","Fortaleza: te enteras de los problemas antes que nadie.","Riesgo: proteger sin explicar puede crear dependencia: que todo pase por ti."],
 solo:["🦸 El que lo resuelve todo solo","Cuando algo falla, lo arreglas tú. Eres rápido y confiable.","Fortaleza: la gerencia sabe que puede contar contigo.","Riesgo: tu equipo no aprende y, cuando no estás, nadie sabe qué hacer."],
 numero:["📊 El que cuida el número","Te enfocas en la meta y en los indicadores. Informas bien y cumples la norma.","Fortaleza: nadie puede decir que no sabías cómo ibas.","Riesgo: la gente escucha los números, pero no sabe qué hacer para moverlos."],
 manda:["📢 El que manda","Corriges rápido y dejas claras las reglas. No hay ambigüedad contigo.","Fortaleza: en una emergencia, todos saben quién decide.","Riesgo: la gente deja de avisarte para no quedar mal, y los problemas llegan tarde."]};
function style(){const t=S.tags,g=k=>t[k]||0;const F=g("explica")+g("delega"),C=g("escucha")+g("protege"),pos=F+C,tot=Object.values(t).reduce((a,b)=>a+b,0)||1,pp=Math.round(pos/tot*100);let best;
 if(pp>=65)best=F>=C*.8?"forma":"cuida";else if(pp<=38){const sc={solo:g("resuelve")*1.6,numero:g("numero"),manda:g("impone")+g("expone")};best=Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0]}else best="mixto";return {best,pos:pp}}
function fate(p){const v=S.tr[p];if(S.cut&&S.cut[p])return "Salió en el recorte de personal.";if(p==="chepe"&&S.fired)return "Fue despedido por la firma falsa, seis meses antes de jubilarse.";if(p==="luis"&&S.moved)return "Fue movido a otro turno mientras Recursos Humanos investiga la queja.";if(S.gone[p])return "Renunció. Se fue a otra fab.";if(p==="mariela"&&S.f.mar_promo)return "Ahora es líder de línea. Dice que aprendió a escuchar trabajando contigo.";
 if(p==="kevin"&&S.f.mentor&&v>=60)return "Ya alinea solo. Don Chepe lo entrenó, y ahora él le explica a otros.";
 return v>=75?"Confía en ti. Te avisa antes de que el problema llegue.":v>=50?"Hace bien su trabajo, pero no siempre te cuenta lo que ve.":v>=25?"Cumple lo mínimo. Lo que sabe, se lo guarda.":"Ya no cree en ti. Si se queda, es por el salario."}
const FAIL={p:"La producción se desplomó: la fab no cumplió con el cliente y el gerente te movió de puesto.",y:"El rendimiento se cayó: se perdieron demasiadas obleas y calidad detuvo la bahía.",e:"Tu cuadrilla se quemó: renuncias, ausencias y nadie quiere el turno A.",g:"El gerente perdió la confianza en ti y nombró a otro supervisor."};
function endGame(){clearSave();const st=style(),s=STY[st.best];const m=MK.map(([k,n,ic])=>`<div>${ic}<b>${S.m[k]}</b>${n}</div>`).join("");
 openD(`<span class="tag">${S.fail?"Fin anticipado · turno "+S.turn:"Fin de las 3 semanas"}</span><h2>Tu espejo de liderazgo</h2>${S.fail?`<div class="box">⚠️ ${FAIL[S.fail]}</div>`:""}
 <div class="box"><b style="font-size:18px">${s[0]}</b><p>${s[1]}</p><p>✅ ${s[2]}</p><p>⚠️ ${s[3]}</p><p class="mut">${st.pos} % de tus decisiones fueron para escuchar, explicar, proteger o delegar.</p></div>
 ${(S.integ&&S.integ.length)?`<h3>Las decisiones graves</h3>${S.integ.map(([v,t])=>`<p>${v>0?"✅":v<0?"⚠️":"➖"} ${t}</p>`).join("")}<div class="box">${S.integ.some(x=>x[0]<0)?"Hubo momentos en que elegiste no perder antes que hacer lo correcto. En la planta real, esas son las decisiones que más pesan, y las que tu equipo nunca olvida.":"En las decisiones graves hiciste lo correcto, aunque te costara en los números. Eso es lo que tu equipo recuerda."}</div>`:""}
 <h3>Así terminó tu cuadrilla</h3>${Object.keys(PEOPLE).map(p=>`<div class="row"><div class="av" style="border-color:${S.gone[p]?"#bbb":tcol(S.tr[p])}">${por(p,S.gone[p]?"s":S.tr[p]>=60?"h":"n")}</div><div style="flex:1"><b>${PEOPLE[p].n}</b><br><span class="mut">${fate(p)}</span></div></div>`).join("")}
 <h3>Los indicadores</h3><div class="grid4">${m}</div>${chart()}
 <h3>Para pensar</h3><p>• ¿Quién de tu cuadrilla real te avisaría primero de un problema? ¿Y quién no?</p><p>• ¿Cuál de tus decisiones repetirías, y cuál cambiarías?</p><p>• ¿Tu equipo sabe qué hace que los indicadores se muevan… o solo los escucha?</p>
 <div class="box" style="text-align:center"><b>Informar es decir cómo vamos.<br>Liderar es lograr que el equipo sepa qué hace que vayamos así.</b></div>
 <button class="btn" onclick="startNew()">Jugar otra vez</button><a class="btn o" href="../index.html">🏠 PES Labs</a>`)}
function chart(){const H=[{p:50,y:50,e:50,g:50}].concat(S.hist||[]);if(H.length<3)return "";const w=520,h=150,X=i=>20+i*(w-40)/(TURNS),Y=v=>h-14-v*(h-30)/100;
 const C={p:"#d98a00",y:"#2f7fd0",e:"#1f9a55",g:"#8b5ad8"};const lines=MK.map(([k])=>`<polyline fill="none" stroke="${C[k]}" stroke-width="3.5" stroke-linejoin="round" points="${H.map((m,i)=>X(i)+","+Y(m[k])).join(" ")}"/>`).join("");
 const wk=[4,8].map(t=>`<line x1="${X(t)}" y1="8" x2="${X(t)}" y2="${h-14}" stroke="#d8c98e" stroke-dasharray="4 4"/>`).join("");
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;background:#fff;border:2px solid #e6d28a;border-radius:12px">${wk}${lines}<text x="${X(2)}" y="${h-2}" font-size="11" text-anchor="middle" fill="#6b7780">Semana 1</text><text x="${X(6)}" y="${h-2}" font-size="11" text-anchor="middle" fill="#6b7780">Semana 2</text><text x="${X(10)}" y="${h-2}" font-size="11" text-anchor="middle" fill="#6b7780">Semana 3</text></svg>
 <p class="mut">${MK.map(([k,n])=>`<b style="color:${C[k]}">━ ${n}</b>`).join(" · ")}</p>${ins(H)}`}
function ins(H){const a=H[Math.min(4,H.length-1)],b=H[H.length-1],st=style().best;
 if((st==="manda"||st==="numero")&&a.p>=b.p)return `<div class="box">📉 La producción arrancó bien… y se fue cayendo. Sin la gente de tu lado, los resultados rápidos no duran.</div>`;
 if((st==="cuida"||st==="forma")&&b.p>=a.p)return `<div class="box">📈 Al principio cuidar a la gente costó producción. Después, el equipo empezó a resolver solo, y los números subieron.</div>`;
 if(st==="cuida"||st==="forma")return `<div class="box">🤔 Cuidaste a la gente, pero los números no te acompañaron. Cuidar también es explicar el resultado y defender la meta.</div>`;return ""}
// ---------- diálogos ----------
function openD(h){$("dlg").innerHTML=h;$("ov").hidden=false;$("dlg").scrollTop=0}
function closeD(){$("ov").hidden=true}
function backD(){if(!S||S.turn===0)menu();else closeD()}
function helpDlg(){openD(`<h2>❓ Cómo se juega</h2><p>Eres el supervisor de la cuadrilla A de fotolitografía en una fab de microchips. Durante 3 semanas (12 turnos) te llegan situaciones: personas de tu equipo, la gerencia, calidad o mantenimiento.</p>
 <p><b>Decide deslizando la carta</b> a la izquierda o a la derecha, o tocando una de las dos opciones. Ninguna es siempre la correcta.</p>
 <p><b>Cuida las 4 barras:</b> 🏭 Producción, 🔬 Rendimiento (obleas buenas), 👥 Equipo y 👔 Gerencia. Si una llega a cero, pierdes el puesto. Los puntos bajo cada barra te muestran qué se moverá, pero no hacia dónde.</p>
 <p><b>Cada persona tiene su confianza</b> en ti (el color de su círculo). Quien confía en ti te avisa de los problemas antes de que crezcan. Quien no confía, se los guarda. Lo que decides hoy vuelve en los turnos siguientes.</p>
 <p>Al final verás tu <b>espejo de liderazgo</b>: qué tipo de líder fuiste y qué pasó con cada persona. Tu partida se guarda sola al terminar cada decisión.</p><button class="btn" onclick="backD()">Entendido</button>`)}
function personDlg(p){const P=PEOPLE[p],v=S.tr[p];openD(`<div class="row"><div class="av" style="width:80px;height:80px;border-color:${S.gone[p]?"#bbb":tcol(v)}">${por(p)}</div><div><h2 style="margin:0">${P.n}</h2><span class="mut">${P.r}</span></div></div><p>${P.bio}</p>${S.gone[p]?`<div class="box">Ya no está en tu cuadrilla.</div>`:`<p><b>Confianza en ti:</b></p><div class="bar" style="height:14px"><i style="width:${v}%;background:${tcol(v)}"></i></div><p class="mut">${v>=75?"Te cuenta todo lo que ve.":v>=55?"Te cuenta lo importante.":v>=30?"Te cuenta solo si le preguntas.":"Ya casi no te cuenta nada."}</p>`}<button class="btn" onclick="backD()">Volver</button>`)}
function teamDlg(){openD(`<h2>👥 Tu cuadrilla</h2>${Object.keys(PEOPLE).map(p=>`<div class="row" style="cursor:pointer" onclick="personDlg('${p}')"><div class="av" style="border-color:${S.gone[p]?"#bbb":tcol(S.tr[p])}">${por(p)}</div><div style="flex:1"><b>${PEOPLE[p].n}</b> <span class="mut">· ${PEOPLE[p].r}</span><div class="bar"><i style="width:${S.gone[p]?0:S.tr[p]}%;background:${tcol(S.tr[p])}"></i></div></div></div>`).join("")}<p class="mut">El color muestra cuánto confía cada persona en ti. Toca a alguien para conocerlo mejor.</p><button class="btn" onclick="backD()">Volver</button>`)}
function menu(){const sv=load();openD(`<div style="text-align:center"><div style="display:flex;justify-content:center;gap:4px;margin:4px 0">${["chepe","mariela","kevin"].map(p=>`<div style="width:90px">${por(p,"h")}</div>`).join("")}</div>
 <span class="tag">Juego de liderazgo · Fab de microchips</span><h2 style="font-size:30px;margin-top:8px">Mi Cuadrilla</h2>
 <p>Eres supervisor de producción en una fab de microchips. Tienes 3 semanas, 6 personas y muchas decisiones sin respuesta obvia.</p><p class="mut">Los números importan. Pero los mueve la gente.</p>
 ${sv?`<button class="btn" onclick="cont()">▶ Continuar (turno ${sv.turn})</button> <button class="btn o" onclick="startNew()">Empezar de nuevo</button>`:`<button class="btn" onclick="startNew()">▶ Empezar</button>`} <button class="btn o" onclick="helpDlg()">❓ Cómo se juega</button>
 <p class="mut" style="margin-top:14px">Personajes, planta y datos ficticios con fines educativos.</p></div>`)}
function startNew(){S=fresh();api();clearSave();closeD();renderMeters();renderTeam();newTurn()}
function cont(){S=Object.assign(fresh(),load());api();closeD();renderMeters();renderTeam();showCard()}
// ---------- arrastre ----------
(function(){const cd=$("card");let x0=null,dx=0;
 cd.addEventListener("pointerdown",e=>{if(busy||!S||!$("ov").hidden)return;x0=e.clientX;dx=0;cd.classList.add("drag");cd.setPointerCapture(e.pointerId)});
 cd.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;cd.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;const s=dx<-25?"L":dx>25?"R":null;$("hl").style.opacity=s==="L"?1:0;$("hr").style.opacity=s==="R"?1:0;preview(s)});
 const up=()=>{if(x0===null)return;x0=null;cd.classList.remove("drag");$("hl").style.opacity=0;$("hr").style.opacity=0;if(dx<-90)choose("L");else if(dx>90)choose("R");else{cd.style.transform="";preview(null)}};
 cd.addEventListener("pointerup",up);cd.addEventListener("pointercancel",up);
 for(const [b,s] of [["bL","L"],["bR","R"]]){$(b).addEventListener("click",()=>choose(s));$(b).addEventListener("mouseenter",()=>preview(s));$(b).addEventListener("mouseleave",()=>preview(null))}
 document.addEventListener("keydown",e=>{if(!$("ov").hidden||!S)return;if(e.key==="ArrowLeft")choose("L");if(e.key==="ArrowRight")choose("R")});})();
S=fresh();api();renderMeters();renderTeam();menu();
</script>
