<style>

.ups{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:6px}
.sb{font-size:12px;padding:6px 4px;line-height:1.2}.sb small{display:block;color:#9aa5b1;font-size:10.5px}.sb.own{background:#0a5a42;border-color:#34d399}.sb:disabled{opacity:.45}

.tabs{display:flex;gap:4px;margin:4px 0 6px}.tb{flex:1;background:#141a20;color:#c9d2db;border:1px solid #34404c;border-radius:7px;padding:5px 2px;font-size:12px;cursor:pointer}.tb.on{background:#0a5a42;color:#fff;border-color:#34d399}
.upl{display:flex;flex-direction:column;gap:4px;margin-top:4px}.upr{display:flex;align-items:center;gap:5px;background:#141a20;border-radius:8px;padding:5px 7px}.upr>div{flex:1;min-width:0}.upr small{display:block;color:#9aa5b1;font-size:10.5px;line-height:1.25}.upr .sb{flex:0 0 auto;padding:6px 7px}
.idea{background:#141a20;border-radius:10px;padding:9px 11px;margin:8px 0;border-left:4px solid #5fb4ff}.idea p{margin:4px 0}.idea.ok{border-color:#34d399}.idea.bad{border-color:#ff6b5e}.idea.no{opacity:.75;border-color:#4a5866}
.vsm{display:flex;gap:2px;overflow-x:auto;padding:6px 0 2px;align-items:stretch}.vc{min-width:66px;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;font-size:11px}
.vb{background:#22303d;border:1px solid #4a5866;border-radius:6px;padding:4px 3px;min-height:74px;width:100%;box-sizing:border-box;font-size:11px;line-height:1.25}.vb small{display:block;color:#b8c2cc;font-size:10px}.vb.ext{background:transparent;border-style:dashed;font-size:12px}
.vt{color:#f2c21b;font-size:30px;line-height:1;position:relative;margin-top:14px}.vt span{position:absolute;left:50%;top:13px;transform:translateX(-50%);font-size:10px;color:#1b1f24;font-weight:800}.vl{color:#9aa5b1;font-size:10px}
.tl{width:100%;height:18px;font-size:10.5px;line-height:18px;border-color:#7a8794;border-style:solid;border-width:0;box-sizing:border-box}.tl.up{border-bottom-width:2px;margin-top:auto;color:#ffd34d}.vc:has(.vb) .tl.up{border-bottom-width:0}.tl.dn{color:#7ee2b8}.vc:has(.vb) .tl.dn{border-bottom-width:2px}.vc:has(.vt) .tl.dn{border-bottom-width:0}
.lbl{position:fixed;z-index:3;transform:translate(-50%,-100%);font-size:11px;font-weight:700;background:rgba(10,14,18,.72);padding:2px 6px;border-radius:5px;pointer-events:none;white-space:nowrap;text-align:center;line-height:1.2}

table.fl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}table.fl td,table.fl th{padding:5px 4px;border-bottom:1px solid #2c3640;text-align:left}
table.fl th{color:#9aa5b1;font-weight:600;font-size:12px}
.barw{background:#2c3640;border-radius:4px;height:8px;width:70px;position:relative;overflow:hidden}.barw i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
select{background:#141a20;color:#fff;border:1px solid #4a5866;border-radius:6px;padding:4px}

@media (max-width:640px){#top{left:8px;right:8px;transform:none;justify-content:space-between}#top .card{font-size:12px;padding:5px 7px}.spd button{padding:5px 6px;font-size:12px}
 #goal,#kpi{font-size:11.5px;max-width:48vw;min-width:0}#bar button{min-width:58px}#bar{justify-content:flex-start}}
</style></head><body>
<canvas id="gl" tabindex="0"></canvas>
<div id="top" class="hud"><div class="card"><b id="dayv">Día 1</b> · <span id="clk">06:00</span></div><div class="card" id="mny"><b>$0</b></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const cv=$("#gl");
const gl=cv.getContext("webgl2",{antialias:true,powerPreference:"high-performance"});
if(!gl){$("#pan").innerHTML="<h2>Tu navegador no soporta WebGL 2</h2><p>Prueba con una versión reciente de Chrome, Edge, Firefox o Safari.</p>";throw new Error("no webgl2")}
/* ---------- matemáticas ---------- */
function trs(o,x,y,z,ry,rx,rz,kx,ky,kz){
  const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),cz=Math.cos(rz),sz=Math.sin(rz);
  const r00=cy*cz+sy*sx*sz,r01=-cy*sz+sy*sx*cz,r02=sy*cx,r10=cx*sz,r11=cx*cz,r12=-sx,r20=-sy*cz+cy*sx*sz,r21=sy*sz+cy*sx*cz,r22=cy*cx;
  o[0]=r00*kx;o[1]=r10*kx;o[2]=r20*kx;o[3]=0;o[4]=r01*ky;o[5]=r11*ky;o[6]=r21*ky;o[7]=0;
  o[8]=r02*kz;o[9]=r12*kz;o[10]=r22*kz;o[11]=0;o[12]=x;o[13]=y;o[14]=z;o[15]=1;return o}
function mul(o,a,b){for(let c=0;c<4;c++)for(let r=0;r<4;r++){o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3]}return o}
function normalMat(n,m){
  const a=m[0],b=m[4],c=m[8],d=m[1],e=m[5],f=m[9],g=m[2],h=m[6],i=m[10];
  const C00=e*i-f*h,C01=-(d*i-f*g),C02=d*h-e*g,C10=-(b*i-c*h),C11=a*i-c*g,C12=-(a*h-b*g),C20=b*f-c*e,C21=-(a*f-c*d),C22=a*e-b*d;
  let det=a*C00+b*C01+c*C02;if(Math.abs(det)<1e-12)det=1e-12;const k=1/det;
  n[0]=C00*k;n[1]=C10*k;n[2]=C20*k;n[3]=C01*k;n[4]=C11*k;n[5]=C21*k;n[6]=C02*k;n[7]=C12*k;n[8]=C22*k;return n}
function persp(o,fy,a,n,f){const t=1/Math.tan(fy/2);o.fill(0);o[0]=t/a;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o}
function lookAt(o,e,t,u){let zx=e[0]-t[0],zy=e[1]-t[1],zz=e[2]-t[2];let l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
  o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);o[15]=1;return o}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
const CC={};function C(h){if(typeof h!=="string")return h;if(CC[h])return CC[h];return CC[h]=[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]}

/* ---------- geometría ---------- */
function boxTris(){const out=[];for(let a=0;a<3;a++)for(const s of[-1,1]){const u=(a+1)%3,v=(a+2)%3;const n=[0,0,0];n[a]=s;
  const c=[[-.5,-.5],[.5,-.5],[.5,.5],[-.5,.5]].map(([p,q])=>{const r=[0,0,0];r[a]=.5*s;r[u]=p;r[v]=q;return r});
  for(const i of[0,1,2,0,2,3])out.push(...c[i],...n)}return out}
function cylTris(seg){const out=[];for(let i=0;i<seg;i++){const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2;
  const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1),x0=c0*.5,z0=s0*.5,x1=c1*.5,z1=s1*.5;
  out.push(x0,-.5,z0,c0,0,s0,x1,-.5,z1,c1,0,s1,x1,.5,z1,c1,0,s1,x0,-.5,z0,c0,0,s0,x1,.5,z1,c1,0,s1,x0,.5,z0,c0,0,s0);
  out.push(0,.5,0,0,1,0,x0,.5,z0,0,1,0,x1,.5,z1,0,1,0,0,-.5,0,0,-1,0,x1,-.5,z1,0,-1,0,x0,-.5,z0,0,-1,0)}return out}
function sphTris(la,lo){const pt=(i,j)=>{const t=i/la*Math.PI,p=j/lo*Math.PI*2;return[Math.sin(t)*Math.cos(p)*.5,Math.cos(t)*.5,Math.sin(t)*Math.sin(p)*.5]};
  const out=[];for(let i=0;i<la;i++)for(let j=0;j<lo;j++){const a=pt(i,j),b=pt(i+1,j),c=pt(i+1,j+1),d=pt(i,j+1);for(const q of[a,b,c,a,c,d])out.push(...q,q[0]*2,q[1]*2,q[2]*2)}return out}
const BOX=boxTris(),CYL=cylTris(14),SPH=sphTris(7,12);

/* ---------- shaders ---------- */
const VS=`#version 300 es
layout(location=0) in vec3 aP;layout(location=1) in vec3 aN;layout(location=2) in vec3 aC;
uniform mat4 uVP,uM;uniform mat3 uNM;out vec3 vN,vC,vW;
void main(){vec4 w=uM*vec4(aP,1.);vW=w.xyz;vN=uNM*aN;vC=aC;gl_Position=uVP*w;}`;
const FS=`#version 300 es
precision highp float;in vec3 vN,vC,vW;uniform vec3 uCol,uEm,uCam,uFogC,uL;uniform float uA;uniform vec2 uFog;out vec4 o;
void main(){vec3 n=normalize(vN);vec3 b=vC*uCol;float h=n.y*.5+.5;vec3 amb=mix(vec3(.34,.35,.37),vec3(.80,.84,.90),h);
float d=max(dot(n,uL),0.);vec3 c=b*(amb*.64+d*vec3(1.,.97,.92)*.58)+uEm;
float f=smoothstep(uFog.x,uFog.y,distance(vW,uCam));o=vec4(mix(c,uFogC,f),uA);}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x}
const PR=gl.createProgram();gl.attachShader(PR,sh(gl.VERTEX_SHADER,VS));gl.attachShader(PR,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(PR);
if(!gl.getProgramParameter(PR,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(PR));
gl.useProgram(PR);
const U={};for(const n of["uVP","uM","uNM","uCol","uEm","uCam","uFogC","uL","uA","uFog"])U[n]=gl.getUniformLocation(PR,n);
gl.vertexAttrib3f(2,1,1,1);
function mkMesh(arr,col){const vao=gl.createVertexArray();gl.bindVertexArray(vao);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,arr instanceof Float32Array?arr:new Float32Array(arr),gl.STATIC_DRAW);const st=(col?9:6)*4;
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,st,0);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,st,12);
  if(col){gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,3,gl.FLOAT,false,st,24)}else gl.disableVertexAttribArray(2);
  gl.bindVertexArray(null);return{vao,n:arr.length/(col?9:6)}}
const BOXM=mkMesh(BOX),CYLM=mkMesh(CYL),SPHM=mkMesh(SPH);

/* ================= reglas del simulador ================= */
const REMATE=10,DAY=28800,PRICE=40,MAT=15,OPC=600,MOVEC=800,TRC=.05,HOLD=1,CLAIM=50,LATE=10,MTTR=900,INST=600;
const FLC=3000,FLOP=200,BONUS=1500,KZT=2700,ACCC=2500,MRC=6000,TWIC=1000;
const SPEED=[0,60,180,480];
const TY={
  mec:{n:"Mecanizado",ic:"⚙️",ct:38,cost:12000,def:.02,mtbf:7200,col:"#3b82f6",sg:0,co:300,ar:.015,
    hz:[["Atrapamiento en el husillo",5,3],["Proyección de virutas",3,4]]},
  ens:{n:"Ensamble",ic:"🔩",ct:70,cost:10000,def:.025,mtbf:10800,col:"#f59e0b",sg:1,co:180,ar:.01,
    hz:[["Golpe del brazo robótico",4,3],["Postura forzada (ergonomía)",2,4]]},
  pru:{n:"Prueba",ic:"🔬",ct:35,cost:9000,def:0,mtbf:14400,col:"#a855f7",sg:2,co:30,ar:.004,
    hz:[["Contacto eléctrico en el banco",4,2],["Ruido del banco de prueba",2,3]]},
  emp:{n:"Empaque",ic:"📦",ct:30,cost:6000,def:.003,mtbf:14400,col:"#10b981",sg:3,co:0,ar:.008,
    hz:[["Atrapamiento en el transportador",4,3],["Sobreesfuerzo al levantar cajas",2,4]]}};
const ORD=["mec","ens","pru","emp"];
const UPG={
  s5:{n:"5S",lv:[{c:800,d:"Ciclo −5 %"},{c:2500,d:"Ciclo −10 %"}],m:[1,.95,.9]},
  py:{n:"Poka-yoke",lv:[{c:1200,d:"Defectos −50 %"},{c:3000,d:"Defectos −75 %"}],m:[1,.5,.25]},
  tpm:{n:"TPM",lv:[{c:1500,d:"Fallas −40 %"},{c:3500,d:"Fallas −65 %"}],m:[1,1/.6,1/.35]},
  smed:{n:"SMED",day:6,lv:[{c:1000,d:"Cambio de modelo −50 %"},{c:3000,d:"Cambio de modelo −80 %"}],m:[1,.5,.2]}};
const SAF={ra:{n:"Evaluación de riesgos",c:300,t:900,d:"Identifica peligros y califica el riesgo (15 min)"},
  eng:{n:"Guarda / barrera",c:1800,t:1200,d:"Control de ingeniería: probabilidad −2 (20 min)"},

  acc:0,nm:0,cos:0,aud:0,bonus:0,qI:[0,0,0,0,0],evs:[]}}

function srnd(){let t=S.seed=(S.seed+0x6D2B79F5)|0;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
function gauss(){return Math.sqrt(-2*Math.log(srnd()+1e-12))*Math.cos(2*Math.PI*srnd())}
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}
const Phi=x=>.5*(1+erf(x/Math.SQRT2));
function addSt(ty,i,j,free){const s={id:S.nid++,ty,i,j,q:[],busy:null,rem:0,held:null,fail:0,inst:free?0:INST,up:{s5:0,py:0,tpm:0,smed:0},k:newK(),num:0,
  stop:0,why:"",kzUp:null,co:0,cur:"A",saf:{ra:0,eng:0,adm:0,epp:0},mod:{ct:0,defM:1,mtbfM:1,riskM:1,coM:1},dr:0,spc:[],pc:0,op:"ok"};
  s.num=1+Math.max(0,...S.st.filter(o=>o.ty===ty).map(o=>o.num));S.st.push(s);return s}
function newK(){return{tot:0,up:0,run:0,prod:0,bad:0,blk:0,stv:0,down:0,co:0}}
const nm=s=>TY[s.ty].n+" "+s.num;
const scen=s=>[-18+2*s.i,-10+2*s.j];
const ctOf=s=>Math.max(TY[s.ty].ct*.5,TY[s.ty].ct*UPG.s5.m[s.up.s5]+s.mod.ct)*(s.op==="temp"?1.3:1);
const defOf=s=>TY[s.ty].def*(s.ty==="mec"?S.defMul:1)*UPG.py.m[s.up.py]*s.mod.defM*(s.op==="temp"?2:1);
const mtbfOf=s=>TY[s.ty].mtbf*UPG.tpm.m[s.up.tpm]*s.mod.mtbfM;
const coOf=s=>Math.round(TY[s.ty].co*UPG.smed.m[s.up.smed]*s.mod.coM);
const driftDef=m=>Phi(-(4-m))+Phi(-(4+m));
function hzRes(s){return TY[s.ty].hz.map(([n,sv,p])=>{const P=Math.max(1,p-(s.saf.eng?2:0)-(s.saf.adm?1:0)),Sv=Math.max(1,sv-(s.saf.epp?1:0));return{n,S:sv,P:p,Sr:Sv,Pr:P,R:Sv*P,R0:sv*p}})}
function riskMult(s){const h=hzRes(s);return h.reduce((a,x)=>a+x.R,0)/h.reduce((a,x)=>a+x.R0,0)*s.mod.riskM*(s.op==="temp"?1.5:1)}
const byId=id=>S.st.find(s=>s.id===id);
function canPlace(i,j,self){if(i<2||i>16||j<0||j>10)return false;return !S.st.some(o=>o!==self&&Math.abs(o.i-i)<2&&Math.abs(o.j-j)<2)}
const flCap=()=>S.fl+(S.mr?3:0);

/* ================= simulación (pasos de 1 s) ================= */
function pay(k,v){D.c[k]+=v;S.money-=v}
function incoming(s){let n=0;for(const r of S.tr)if(r.d===s.id)n++;for(const r of S.trq)if(r.d===s.id)n++;return n}
function stageCount(sg){let n=0;if(sg===4)n=S.fg.length;else if(sg>0)for(const s of S.st)if(TY[s.ty].sg===sg)n+=s.q.length;
  if(sg===0)for(const s of S.st)if(s.ty==="mec")n+=s.q.length;for(const r of S.tr)if(r.sg===sg)n++;for(const r of S.trq)if(r.sg===sg)n++;return n}
function choose(sg,from,p){let best=null,bs=1e9;for(const s of S.st){if(TY[s.ty].sg!==sg)continue;const c=scen(s);
  const lp=s.q.length?s.q[s.q.length-1].p:s.busy?s.busy.p:s.cur;const sc=(p&&lp&&lp!==p&&TY[s.ty].co?1.5:0)+s.q.length+incoming(s)+(s.busy?1:0)+(s.fail>0?4:0)+(s.stop>0?5:0)+(s.inst>0?6:0)+(Math.abs(c[0]-from[0])+Math.abs(c[1]-from[1]))*.01;if(sc<bs){bs=sc;best=s}}return best}
function send(it,from,dest){const to=dest?scen(dest):SHIP;const d=Math.abs(to[0]-from[0])+Math.abs(to[1]-from[1]);
  const r={it,f:[from[0],from[1]],to:[to[0],to[1]],d:dest?dest.id:-1,sg:dest?TY[dest.ty].sg:4,t:0,T:d/1.0+10+(S.mr?15:0),L:d};
  if(!S.flStop&&S.flBusy.length<flCap())dispatch(r);else S.trq.push(r)}
function dispatch(r){S.tr.push(r);S.flBusy.push(S.abs+Math.round(r.T+r.L*.5*(S.mr?.5:1)));pay("tr",r.L*TRC*(S.mr?.5:1));D.dist+=r.L;
  if(F("acc")){const p=r.L/90000*(S.walk?.5:1)*(S.prox?.4:1)*S.g.flRisk;const u=srnd();
    if(u<p)flAccident();else if(u<p*7){D.nm++;radio("nmf","⚠️ Casi accidente: un montacargas casi atropella a un peatón. Más metros recorridos = más exposición.",2400)}}}
function fgCount(p){let n=0;for(const it of S.fg)if((it.p||"A")===p)n++;for(const r of S.tr)if(r.sg===4&&(r.it.p||"A")===p)n++;for(const r of S.trq)if(r.sg===4&&(r.it.p||"A")===p)n++;return n}
function tryPush(s,it){const sg=TY[s.ty].sg+1,lim=S.kan[sg-1];if(lim&&(sg===4&&F("prod2")?fgCount(it.p||"A"):stageCount(sg))>=lim)return false;
  if(sg===4){send(it,scen(s),null);return true}const d=choose(sg,scen(s),it.p);if(!d){radio("miss"+sg,`⛔ No hay ninguna estación de ${TY[ORD[sg]].n}: el flujo está detenido.`,1800);return false}send(it,scen(s),d);return true}
function nextProd(){if(!F("prod2"))return"A";S.relN++;const L=S.relP==="A"?S.lot:Math.max(1,Math.round(S.lot*.67));if(S.relN>L){S.relN=1;S.relP=S.relP==="A"?"B":"A"}return S.relP}
function step(){
  S.t++;S.abs++;D.t++;
  // pedidos del cliente
  S.oacc++;if(S.oacc>=S.takt){S.oacc-=S.takt;D.ord++;const p=F("prod2")&&srnd()<.4?"B":"A";S.bk[p]++;S.back++}
  // eventos
  for(const e of S.ev)if(!e.done&&S.t>=e.t){e.done=1;fireEv(e.k)}
  if(S.pwr>0)S.pwr--;
  // montacargas
  if(S.flStop>0)S.flStop--;else{if(S.flBusy.length){const a=S.abs;S.flBusy=S.flBusy.filter(e=>e>a)}while(S.trq.length&&S.flBusy.length<flCap())dispatch(S.trq.shift())}
  // material a Mecanizado (supermercado)
  if(S.supply>0)S.supply--;else for(const s of S.st)if(s.ty==="mec"&&s.inst<=0&&s.q.length+incoming(s)+(s.busy?1:0)<S.g.rawBuf){const it={b:0,t0:S.abs,c:0,p:nextProd()};pay("mat",S.g.matC);D.rel++;send(it,RECV,s)}
  // transporte
  for(let k=S.tr.length-1;k>=0;k--){const r=S.tr[k];r.t++;if(r.t<r.T)continue;S.tr.splice(k,1);
    if(r.d===-1){S.fg.push(r.it);continue}const s=byId(r.d);if(s){s.q.push(r.it);continue}
    const alt=choose(r.sg,r.to);if(alt)send(r.it,r.to,alt);else{D.scrap++;S.scrap++}}
  // estaciones (de la última etapa hacia la primera)

const ptr=new Map();let drag=null,pinch=null;
function clampT(){cam.t[0]=clamp(cam.t[0],-30,30);cam.t[2]=clamp(cam.t[2],-22,22)}
function panBy(ax,ay,bx,by){const a=pick(ax,ay),b=pick(bx,by);if(!a||!b)return;cam.t[0]+=a[0]-b[0];cam.t[2]+=a[1]-b[1];clampT()}
function zoomAt(f,px,py){const nd=clamp(cam.dist*f,14,125);f=nd/cam.dist;if(f===1)return;const w=pick(px,py);cam.dist=nd;
  if(w){cam.t[0]=w[0]+(cam.t[0]-w[0])*f;cam.t[2]=w[1]+(cam.t[2]-w[1])*f;clampT()}}
function mid(){const[a,b]=[...ptr.values()];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)||1,a:Math.atan2(b.y-a.y,b.x-a.x),tw:0}}
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{audioInit();cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===1)drag={lx:e.clientX,ly:e.clientY,sx:e.clientX,sy:e.clientY,moved:false,rot:e.button===2||e.button===1||e.shiftKey};else{if(drag)drag.moved=true;pinch=mid()}});
cv.addEventListener("pointermove",e=>{
  if(e.pointerType==="mouse"&&mode){const w=pick(e.clientX,e.clientY);if(w){const c=cellAt(w);ghost={i:c.i,j:c.j,ok:canPlace(c.i,c.j,mode.move?byId(mode.move):null)}}}
  if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size>=2&&pinch){const p=mid();panBy(pinch.x,pinch.y,p.x,p.y);zoomAt(pinch.d/p.d,p.x,p.y);
    const da=angDiff(pinch.a,p.a);p.tw=pinch.tw+da;if(Math.abs(p.tw)>.35)cam.yaw-=da;pinch=p;return}
  if(!drag)return;const lx=drag.lx,ly=drag.ly;drag.lx=e.clientX;drag.ly=e.clientY;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6){drag.moved=true}if(!drag.moved)return;
  if(drag.rot){cam.yaw-=(e.clientX-lx)*.006;cam.pitch=clamp(cam.pitch+(e.clientY-ly)*.004,.45,1.45)}
  else panBy(lx,ly,e.clientX,e.clientY)});
const up=e=>{if(drag&&!drag.moved&&ptr.size===1&&ptr.has(e.pointerId))tap(e.clientX,e.clientY);ptr.delete(e.pointerId);
  if(ptr.size<2)pinch=null;if(ptr.size===1){const[q]=[...ptr.values()];drag={lx:q.x,ly:q.y,sx:q.x,sy:q.y,moved:true,rot:false}}if(!ptr.size)drag=null};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",e=>{ptr.delete(e.pointerId);if(!ptr.size)drag=null;pinch=null});
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(Math.exp(clamp(e.deltaY,-120,120)*.0018),e.clientX,e.clientY)},{passive:false});
let lastTap=0;cv.addEventListener("dblclick",e=>{camAnim.z+=Math.log(.6);camAnim.px=e.clientX;camAnim.py=e.clientY});
const camAnim={z:0,y:0,px:0,py:0,home:0};
function camBtn(k){const cx=innerWidth/2,cy=innerHeight/2;camAnim.px=cx;camAnim.py=cy;
  if(k==="in")camAnim.z+=Math.log(.7);if(k==="out")camAnim.z+=Math.log(1/.7);if(k==="l")camAnim.y+=Math.PI/4;if(k==="r")camAnim.y-=Math.PI/4;if(k==="h")camAnim.home=1}
const keys={};addEventListener("keydown",e=>{if(!$("#ov").hidden)return;keys[e.code]=1;
  if(e.code==="Space"){S.spd=S.spd?0:2;topBar();e.preventDefault()}if(e.code==="Escape"){setMode(null);select(null)}
  if(e.key==="+"||e.code==="NumpadAdd")camBtn("in");if(e.key==="-"||e.code==="NumpadSubtract")camBtn("out");if(e.code==="KeyH")camBtn("h");
  if(/^Digit[1-4]$/.test(e.code)){setMode({build:ORD[+e.code[5]-1]});select(null)}if(e.code==="KeyK")flowPanel()});
addEventListener("keyup",e=>{keys[e.code]=0});
function homeView(){const p=innerWidth<innerHeight;return{d:p?Math.min(120,46*1.25*innerHeight/innerWidth):46,t:[0,0,p?7:1]}}
function camUpdate(dt){const r=(keys.KeyQ?1:0)-(keys.KeyE?1:0);cam.yaw+=r*dt*1.4;const mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),mz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(mx||mz){const v=cam.dist*.7*dt,cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);cam.t[0]=clamp(cam.t[0]+(cy*mx+sy*mz)*v,-30,30);cam.t[2]=clamp(cam.t[2]+(-sy*mx+cy*mz)*v,-22,22)}
  const a=Math.min(1,dt*9);if(Math.abs(camAnim.z)>.001){const s=camAnim.z*a;camAnim.z-=s;zoomAt(Math.exp(s),camAnim.px,camAnim.py)}
  if(Math.abs(camAnim.y)>.001){const s=camAnim.y*a;camAnim.y-=s;cam.yaw+=s}
  if(camAnim.home){const h=homeView(),k=Math.min(1,dt*6);cam.dist+=(h.d-cam.dist)*k;cam.t[0]+=(h.t[0]-cam.t[0])*k;cam.t[2]+=(h.t[2]-cam.t[2])*k;cam.yaw+=angDiff(cam.yaw,0)*k;cam.pitch+=(.98-cam.pitch)*k;
    if(Math.abs(h.d-cam.dist)<.2&&Math.abs(cam.yaw)<.01)camAnim.home=0}
  const cp=Math.cos(cam.pitch);cam.e=[cam.t[0]+Math.sin(cam.yaw)*cp*cam.dist,Math.sin(cam.pitch)*cam.dist,cam.t[2]+Math.cos(cam.yaw)*cp*cam.dist]}

function genIdeas(){let pool=IDEAS.filter(x=>(!x.day||S.day>=x.day)&&!S.used.includes(x.k)&&(x.ty==="plant"||(x.ty===null?S.st.length:S.st.some(s=>x.ty.includes(s.ty)))));
  if(pool.length<3){S.used=S.used.filter(k=>IDEAS.find(x=>x.k===k).ty!=="plant"?false:true);pool=IDEAS.filter(x=>(!x.day||S.day>=x.day)&&!S.used.includes(x.k)&&(x.ty==="plant"||(x.ty===null?S.st.length:S.st.some(s=>x.ty.includes(s.ty)))))}
  S.ideas=[];for(let n=0;n<3&&pool.length;n++){const ix=Math.floor(srnd()*pool.length),x=pool.splice(ix,1)[0];let st=null;
    if(x.ty!=="plant"){const c=S.st.filter(s=>x.ty===null||x.ty.includes(s.ty));st=c[Math.floor(srnd()*c.length)].id}
    S.ideas.push({k:x.k,st,who:NAMES[Math.floor(srnd()*NAMES.length)],done:0});S.used.push(x.k)}}
function ideasPanel(){const I=k=>IDEAS.find(x=>x.k===k);
  openOv(`<h2>💡 Ideas del personal</h2><p class="mut">Las mejores mejoras suelen salir de quien hace el trabajo, y casi siempre son baratas. Pero no todas las ideas son buenas: piensa en el efecto completo antes de aplicarla.</p>`+
   S.ideas.map((d,ix)=>{const x=I(d.k),s=d.st?byId(d.st):null;const tgt=x.ty==="plant"?"Toda la planta":s?nm(s):"(estación ya no existe)";
     return`<div class="idea ${d.done===1?(x.g?"ok":"bad"):d.done===-1?"no":""}"><div class="mut">${d.who} · ${tgt}</div><b>${x.t}</b><p>«${x.cl}»</p>`+
      (d.done?`<p class="${d.done===1?(x.g?"g":"r"):"mut"}">${d.done===1?(x.g?"✅ ":"⚠️ ")+x.r:(x.g?"Se descartó. Era buena idea: "+x.r:"👍 Buen criterio: "+x.r)}</p>`:
       `<div class="row"><button class="sb" data-ia="${ix}" ${x.ty!=="plant"&&!s?"disabled":""}>Aplicar · ${x.c?money(x.c):"gratis"}</button><button class="sb" data-id="${ix}">Descartar</button></div>`)+`</div>`}).join("")+
   `<button class="btn" id="iok">Listo</button>`);
  document.querySelectorAll("[data-ia]").forEach(b=>b.onclick=()=>{const d=S.ideas[+b.dataset.ia],x=I(d.k);if(x.c&&!spend(x.c))return;
    x.ap(d.st?byId(d.st):null);d.done=1;(x.g?sfx.ok:sfx.no)();ideasPanel()});
  document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{S.ideas[+b.dataset.id].done=-1;ideasPanel()});
  $("#iok").onclick=closeOv}

function help(inGame){openOv(`<h1>🏭 Simulador de Planta Esbelta</h1>
  <p>Diseña y dirige tu propia planta: coloca estaciones, conecta el flujo, pon límites kanban y mejora con <b>5S, Poka-yoke, TPM y SMED</b>, cuidando la <b>seguridad</b> y a las <b>personas</b>. Son ${LASTDAY} días, cada uno con un reto y una lección.</p>
  <h3>Cómo funciona</h3><ul><li>Las piezas entran por <b>Recepción</b>, pasan por <b>Mecanizado → Ensamble → Prueba → Empaque</b> y salen por <b>Embarque</b>.</li>
  <li>Los montacargas llevan cada pieza; si todos están ocupados, la pieza espera. Cada metro cuesta y es exposición a riesgo.</li>
  <li>Las mejoras tienen 2 niveles. Puedes pagarlas o hacer un <b>evento kaizen</b>: gratis, pero la estación se detiene 45 min.</li>
  <li>Cada estrella del día da un <b>bono de gerencia</b> de ${money(BONUS)}.</li>
  <li>Cada estación cuesta $600 por turno. Cada unidad entregada deja $40 y su material cuesta $15. El inventario cuesta $1 por unidad cada hora.</li>
  <li>Semáforo: 🟢 trabajando · 🟡 esperando · 🟧 bloqueada por kanban · 🟣 cambio de modelo · 🔴 falla o accidente · 🔵 instalando o en actividad.</li></ul>
  <h3>Controles</h3><ul><li><b>Celular:</b> arrastra con un dedo para mover la planta y pellizca con dos para acercar. Botones de la derecha: ＋ y − zoom, ⟲ y ⟳ girar, ⌂ vista completa. Toca una estación para verla.</li>
  <li><b>Computadora:</b> arrastra para mover, rueda para acercar, doble clic para acercar, clic derecho y arrastrar (o Q/E) para girar, flechas o WASD para desplazar, H vista completa. 1-4 construyen, K abre el flujo, espacio pausa.</li></ul>
  <p class="mut">Puedes construir y ajustar todo con el juego en pausa. La partida se guarda sola cada 30 minutos de planta, al cerrar la página y con el botón 💾 Guardar. Planta y datos ficticios con fines didácticos. Un juego de PES Labs.</p>
  ${inGame?`<button class="btn" id="hok">Continuar</button>`:`<button class="btn" id="hnew">Nueva partida</button>${SAVED?`<button class="btn o" id="hcont">▶ Continuar partida guardada · Día ${SAVED.day}${SAVED.t>0?" · "+clockOf(SAVED.t):""}</button>`:""}`}`);
  if(inGame)$("#hok").onclick=closeOv;else{$("#hnew").onclick=()=>{audioInit();newGame();startDay()};if(SAVED)$("#hcont").onclick=()=>{audioInit();S=SAVED;D=S.D;try{SNAP=localStorage.getItem("pes_sim_v2_day")}catch(e){}if(!SNAP)SNAP=JSON.stringify(SAVED);
    if(S.t>0){S.spd=0;closeOv();select(null);setMode(null);buildBar();ui();if(S.t>=DAY)endDay();else flash(`Partida cargada: día ${S.day}, ${clock()}. Pulsa ▶ para seguir.`)}else startDay(true)}}}
function clockOf(t){const m=360+Math.floor(t/60);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function saveNow(){if(!S)return false;try{localStorage.setItem("pes_sim_v2",JSON.stringify(S));if(SNAP)localStorage.setItem("pes_sim_v2_day",SNAP);return true}catch(e){return false}}
addEventListener("pagehide",saveNow);document.addEventListener("visibilitychange",()=>{if(document.hidden)saveNow()});

let SNAP=null,SAVED=null;
try{const j=localStorage.getItem("pes_sim_v2");if(j){SAVED=JSON.parse(j);if(!SAVED||SAVED.v!==2)SAVED=null}}catch(e){SAVED=null}
function startDay(resume){const dd=dayDef(S.day);S.takt=dd.takt;if(F("drift"))S.defMul=3;
  if(!resume){S.t=0;S.oacc=0;S.back=0;S.bk={A:0,B:0};S.kzN=F("ev")?2:1;S.ev=[];S.supply=0;S.pwr=0;S.flStop=0;
    for(const s of S.st){s.k=newK();s.op="ok";if(s.why==="acc"){s.stop=0;s.why=""}}
    if(F("ev")){const ks=["prov","corte","urg","aud"];for(let n=0;n<2;n++){const k=ks.splice(Math.floor(srnd()*ks.length),1)[0];S.ev.push({k,t:3600+Math.floor(srnd()*21600),done:0})}}
    if(F("abs")){const ab=S.st.filter(()=>srnd()<.15);if(S.day===UNLOCK.abs&&!ab.length&&S.st.length){const e=S.st.find(s=>s.ty==="ens")||S.st[0];ab.push(e)}
      for(const s of ab)s.op=S.cover[s.ty]>coverUsed(s.ty)?"cub":"temp";S.absList=ab.map(s=>s.id)}else S.absList=[];
    if(F("ideas"))genIdeas();
    D=newD();S.D=D}
  SNAP=JSON.stringify(S);try{localStorage.setItem("pes_sim_v2",SNAP);localStorage.setItem("pes_sim_v2_day",SNAP)}catch(e){}
  S.spd=0;select(null);setMode(null);buildBar();ui();
  const ab=(S.absList||[]).map(byId).filter(Boolean);
  openOv(`<h2>${dd.t}</h2>${dd.intro}${S.lastRem>0&&!resume?`<p class="mut">📦 Ayer sobraron ${S.lastRem} unidades sin pedido y Ventas las remató a $${REMATE} cada una.</p>`:""}
   ${ab.length?`<p>👤 <b>Ausencias hoy:</b> ${ab.map(s=>nm(s)+(s.op==="cub"?" (cubierta por un polivalente)":" (entra un temporal)")).join(", ")}.</p>`:""}
   <div class="lesson">💡 ${dd.tip}</div>
   <h3>Meta</h3><ul>${dd.goals(KP()).map((g,i)=>`<li>${i?"⭐ ":"<b>Para aprobar:</b> "}${g[0]}</li>`).join("")}</ul>
   <p class="mut">Caja: <b>${money(S.money)}</b>${F("ideas")?` · Tienes ${pendingIdeas()} ideas nuevas en 💡`:""}. El juego queda en pausa para que prepares la planta; luego pulsa ▶.</p>
   <button class="btn" id="dgo">Preparar la planta</button>`);
  $("#dgo").onclick=()=>{closeOv();sfx.ok()}}
function vsmHTML(){const t=Math.max(1,D.t),lam=D.del>0?D.del/t:1/S.takt;let html='<div class="vsm">',va=0,wt=0,cols=[];
  const tri=(k,lab)=>{const inv=D.qI[k]/t,w=inv/lam/60;wt+=w;cols.push(`<div class="vc"><div class="vt">▲<span>${inv.toFixed(1)}</span></div><div class="vl">${lab}</div><div class="tl up">${w.toFixed(1)} min</div><div class="tl dn"></div></div>`)};
  cols.push(`<div class="vc"><div class="vb ext">🏭<br>Proveedor</div><div class="tl up"></div><div class="tl dn"></div></div>`);
  ORD.forEach((k,g)=>{tri(g,g?"cola":"super");const ss=S.st.filter(s=>s.ty===k),n=ss.length;const ct=n?ss.reduce((a,s)=>a+ctOf(s),0)/n:0;va+=ct;
    let A=0,m=0;for(const s of ss){const o=oeeOf(s);if(o){A+=o.A;m++}}
    cols.push(`<div class="vc"><div class="vb"><b>${TY[k].n}</b><small>C/T ${ct.toFixed(0)} s<br>${n} est.<br>Disp. ${m?pc(A/m):"—"}${F("prod2")&&n?"<br>C/O "+Math.round(coOf(ss[0])/60)+" min":""}</small></div><div class="tl up"></div><div class="tl dn">${ct.toFixed(0)} s</div></div>`)});
  tri(4,"PT");cols.push(`<div class="vc"><div class="vb ext">🚚<br>Cliente<small>takt ${S.takt} s</small></div><div class="tl up"></div><div class="tl dn"></div></div>`);
  const lt=wt+va/60,pva=lt>0?va/60/lt:0;
  return html+cols.join("")+`</div><div class="kv"><span>Tiempo de entrega (VSM)</span><b>${lt.toFixed(1)} min</b><span>Tiempo de valor agregado</span><b>${(va/60).toFixed(1)} min</b><span>% de valor agregado</span><b class="${pva>.25?"g":"y"}">${(pva*100).toFixed(1)} %</b></div>
   <p class="mut">Los triángulos ▲ son el inventario promedio en cada punto; arriba de la línea de tiempo va la espera (Ley de Little) y abajo el tiempo de proceso. Casi todo el tiempo de entrega es espera: ahí está la oportunidad.</p>`}
function endDay(){S.spd=0;const late=S.back;pay("late",late*LATE);D.miss=late;S.back=0;S.bk={A:0,B:0};const rem=Math.max(0,S.fg.length-10);S.fg.splice(0,rem);D.rev+=rem*REMATE;S.money+=rem*REMATE;D.rem=rem;S.lastRem=rem;
  const K=KP(),dd=dayDef(S.day),gs=dd.goals(K);
  const pass=gs[0][1],stars=pass?1+(gs[1][1]?1:0)+(gs[2][1]?1:0):0;S.best[S.day]=Math.max(S.best[S.day]||0,stars);sfx.end();
  const bonus=stars*BONUS;D.bonus=bonus;S.money+=bonus;S.noAcc=D.acc?0:S.noAcc+1;
  const tips=[];if(K.otd<.95)tips.push("Entregas bajas: en 📊 Flujo, la etapa con ciclo efectivo mayor que el takt es tu restricción. Revisa también fallas, cambios de modelo y montacargas en espera.");
  if(K.inv>25)tips.push("Mucho inventario: pon límites kanban en todas las conexiones, empezando por Empaque → Embarque.");
  if(K.ltn&&K.lt>20)tips.push("Tiempo de entrega alto: por la Ley de Little baja con menos inventario. Kanban más pequeños y estaciones más cerca.");
  if(K.tst&&K.fpy<.95)tips.push("Calidad: poka-yoke en Mecanizado y Ensamble, y ajusta la herramienta cuando la carta X̄ se acerque al límite.");
  if(K.acc)tips.push("Hubo accidentes: haz evaluaciones de riesgos y aplica controles de ingeniería primero. Revisa también los pasillos peatonales.");
  if(rem>20)tips.push(`Sobreproducción: ${rem} unidades sin pedido se remataron a $${REMATE}, aunque cada una costó más de $15. Un kanban en Empaque → Embarque lo evita.`);
  if(K.pf<0)tips.push("Utilidad negativa: cuida el material que entra sin pedido, los metros de montacargas y las estaciones de sobra ($600 por turno cada una). Las ideas del personal y los eventos kaizen mejoran sin gastar casi nada.");
  const c=D.c,fin=S.day===LASTDAY&&pass;
  openOv(`<h2>📋 Cierre del ${dd.t.split(" · ")[0].toLowerCase()}</h2><div class="stars">${stars?"⭐".repeat(stars)+"☆".repeat(3-stars):"☆☆☆"}</div>
   <p style="text-align:center;margin:0">${pass?(stars===3?"¡Turno perfecto!":"Meta cumplida."):"No se alcanzó la meta principal."}</p>
   <ul>${gs.map(g=>`<li>${g[1]?"✅":"❌"} ${g[0]} <span class="mut">(${g[2]})</span></li>`).join("")}</ul>
   <div class="kv"><span>Pedidos del cliente</span><b>${K.ord}</b><span>Entregados a tiempo</span><b>${K.del} (${pc(K.otd)})</b><span>Pedidos cancelados (multa $${LATE} c/u)</span><b>${late}</b>
   <span>Tiempo de entrega promedio</span><b>${K.ltn?K.lt.toFixed(1)+" min":"—"}</b><span>Inventario promedio (WIP + PT)</span><b>${K.inv.toFixed(1)}</b>
   <span>OEE de la planta</span><b>${pc(K.oee)}</b><span>Calidad a la primera</span><b>${K.tst?pc(K.fpy):"—"}</b><span>Piezas desechadas · reclamos</span><b>${K.scrap} · ${K.cl}</b>
   <span>Recorrido de montacargas</span><b>${(K.dist/1000).toFixed(1)} km</b>${F("acc")?`<span>Accidentes · casi accidentes</span><b class="${K.acc?"r":"g"}">${K.acc} · ${K.nm}</b>`:""}${F("prod2")?`<span>Cambios de modelo</span><b>${K.cos}</b>`:""}</div>
   <h3>🗺️ Mapa de flujo de valor del día</h3>${vsmHTML()}
   <div class="kv"><span>Ventas</span><b class="g">${money(K.rev-rem*REMATE)}</b>${rem?`<span>Remate de ${rem} unidades sobrantes ($${REMATE} c/u)</span><b class="y">${money(rem*REMATE)}</b>`:""}<span>Material</span><b>−${money(c.mat)}</b><span>Operación (estaciones, montacargas, personal)</span><b>−${money(c.op)}</b><span>Transporte interno</span><b>−${money(c.tr)}</b>
   <span>Costo de inventario</span><b>−${money(c.hold)}</b><span>Reclamos y multas</span><b>−${money(c.claim+c.late)}</b>${c.saf?`<span>Accidentes y auditoría</span><b>−${money(c.saf)}</b>`:""}${D.aud>0?`<span>Bono de auditoría</span><b class="g">${money(D.aud)}</b>`:""}<span><b>Utilidad operativa</b></span><b class="${K.pf>=0?"g":"r"}">${money(K.pf)}</b>
   <span>Bono de gerencia (${stars} ⭐)</span><b class="g">${money(bonus)}</b><span>Inversiones del día</span><b>${money(D.capex)}</b><span>Caja</span><b>${money(S.money)}</b></div>
   <div class="lesson">📘 ${dd.lesson}</div>${tips.length?`<h3>Para mejorar</h3><ul>${tips.map(t=>`<li>${t}</li>`).join("")}</ul>`:""}
   ${fin?`<div class="lesson" style="border-color:#f2c21b;background:#2a2410">🏆 ¡Completaste la campaña! Total: ${Object.values(S.best).reduce((a,b)=>a+b,0)} de ${LASTDAY*3} estrellas. Puedes seguir en modo libre.</div>`:""}
   ${pass||S.day>LASTDAY?`<button class="btn" id="dnext">${S.day>=LASTDAY?"Seguir en modo libre":"Siguiente día"}</button>`:""}<button class="btn ${pass?"o":""}" id="dre">Repetir el día</button>${pass||S.day>LASTDAY?"":`<button class="btn o" id="dnext">Seguir de todas formas</button>`}`);
  $("#dnext").onclick=()=>{S.day++;startDay()};$("#dre").onclick=()=>{S=JSON.parse(SNAP);D=S.D;for(const k in RAD)delete RAD[k];startDay(true)}}

let last=performance.now(),acc=0,uiT=0;

  if(S&&$("#ov").hidden&&S.spd>0){acc+=SPEED[S.spd]*Math.min(.25,raw);let n=Math.floor(acc);acc-=n;n=Math.min(n,600);for(let k=0;k<n;k++){step();if(S.t%1800===0)saveNow();if(S.t>=DAY){endDay();break}if(!$("#ov").hidden){acc=0;break}}}
  camUpdate(dt);if(S){render(t);uiT-=dt;if(uiT<=0){uiT=.2;ui()}}requestAnimationFrame(frame)}
newGame();buildBar();ui();help(false);requestAnimationFrame(frame);
