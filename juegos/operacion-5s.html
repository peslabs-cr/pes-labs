<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operación 5S</title>
<style>
:root{--bg:#f6f7f9;--fg:#1b1f24;--card:#fff;--mut:#667085;--ac:#0a7d5a;--bd:#dde1e6;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c;--fg:#e8ebee;--card:#1d2328;--mut:#98a2b3;--ac:#34d399;--bd:#2c343b;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#14181c;--fg:#e8ebee;--card:#1d2328;--mut:#98a2b3;--ac:#34d399;--bd:#2c343b;--bad:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 8px}h2{font-size:17px;margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
button{font:inherit;font-size:13px;padding:9px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;position:relative}
button.main{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;font-size:15px;padding:12px;margin-top:10px}
.steps{display:flex;gap:4px;margin-bottom:10px}.steps i{flex:1;text-align:center;font-style:normal;font-size:10px;padding:5px 0;border-radius:8px;background:var(--bd);color:var(--mut)}
.steps i b{display:block;font-size:13px}.steps i small{display:block;font-size:9px}.steps i.cur{background:var(--ac);color:#fff}.steps i.done{background:var(--ac);opacity:.55;color:#fff}
.bub{display:flex;gap:8px;align-items:flex-start;margin:8px 0}.av{font-size:26px;background:var(--bg);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.tx{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px}.tx small{color:var(--mut);display:block;font-size:11px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.it{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;transition:transform .15s,opacity .2s}.it span{font-size:28px}.it small{font-size:11px;text-align:center}
.it:active{transform:scale(.94)}.it.tag{opacity:.5;border-color:var(--bad);transform:rotate(-3deg)}.it.tag::after{content:"🏷️";position:absolute;top:-6px;right:-2px;font-size:18px}
.it.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac);transform:translateY(-3px)}
.zone{display:block;width:100%;text-align:left;margin-top:6px;padding:10px;min-height:54px}.zone div{font-size:22px;min-height:26px}
.desk{position:relative;height:240px;border-radius:12px;margin-top:8px;background:repeating-linear-gradient(45deg,var(--bg) 0 14px,var(--bd) 14px 15px)}
.sp{position:absolute;font-size:26px;cursor:pointer;transition:all .3s;user-select:none}.sp.fade{transform:scale(1.5);opacity:.35;pointer-events:none}.sp.lk{animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.25)}}@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.07)}100%{transform:scale(1)}}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tbar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.tbar div{height:100%;background:var(--ac)}
.opt{display:block;width:100%;text-align:left;margin-top:6px;padding:11px}
.mcard{text-align:center;font-weight:700;padding:8px;border-radius:10px;box-shadow:0 0 0 3px var(--ac);animation:pop .35s}.mcard.bad{box-shadow:0 0 0 3px var(--bad);animation:shk .35s}
.chart{display:flex;gap:6px;align-items:flex-end;height:90px;margin:6px 0}.chart div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;display:flex;justify-content:center;font-size:11px;color:#fff}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pane{background:var(--bg);border-radius:10px;padding:8px;min-height:110px;font-size:12px}.pane .e{display:inline-block;font-size:24px}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:4px 6px;border-bottom:1px solid var(--bd)}
.it.tag2{opacity:.6;border-color:#d97706;transform:rotate(2deg)}.it.tag2::after{content:"🟡";position:absolute;top:-6px;right:-2px;font-size:18px}
.big{text-align:center;padding:14px;margin:8px 0;border-radius:12px;background:var(--bg);animation:pop .25s}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.row3 button{padding:14px 4px;font-size:14px}
</style></head><body><main>
<h1>🧹 Operación 5S</h1>
<div id="app"></div>
</main>
<script>
const $=id=>document.getElementById(id);
var AU=null;
function beep(f,d,t){try{AU=AU||new(window.AudioContext||window.webkitAudioContext)();if(AU.state=="suspended")AU.resume();const o=AU.createOscillator(),g=AU.createGain();o.type=t||"square";o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AU.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AU.currentTime+d);o.stop(AU.currentTime+d)}catch(e){}}
function tune(a){a.forEach((f,i)=>setTimeout(()=>beep(f,.14),i*110))}
const P={mgr:["Marta","Gerente de planta","👩‍💼"],qa:["Carlos","Ing. de Calidad","🧑‍🔬"],pe:["Lucía","Ing. de Procesos","👷‍♀️"],op:["Don Beto","Operador","🧑‍🏭"]};
function bub(k,t){return `<div class="bub"><div class="av">${P[k][2]}</div><div class="tx"><small>${P[k][0]} · ${P[k][1]}</small>${t}</div></div>`}
const STG=[["Seiri","Clasificar"],["Seiton","Ordenar"],["Seiso","Limpiar"],["Seiketsu","Estandarizar"],["Shitsuke","Disciplina"]];
let G,BEST=0;
const head=()=>`<div class="steps">${STG.map((s,i)=>`<i class="${i<G.st?"done":i==G.st?"cur":""}"><b>${i+1}</b>${s[0]}<small>${s[1]}</small></i>`).join("")}</div>`;
const D=()=>G.lv==2,sh=a=>[...a].sort(()=>Math.random()-.5);
const stR=r=>r>=(D()?.97:.95)?3:r>=(D()?.85:.8)?2:r>=(D()?.7:.6)?1:0;
function tmr(ms,end){clearInterval(G.tm);G.t0=Date.now();G.tl=ms;G.tm=setInterval(()=>{const f=1-(Date.now()-G.t0)/ms,b=$("tb");if(b){b.style.width=Math.max(0,f*100)+"%";b.style.background=f<.3?"#dc2626":""}if(f<=0){clearInterval(G.tm);end()}},100)}
const left=()=>G.tl?Math.max(0,1-(Date.now()-G.t0)/G.tl):0;
const TB=()=>`<div class="tbar" style="margin:8px 0"><div id="tb" style="width:${G.tl?left()*100:100}%"></div></div>`;
function home(){clearInterval(G&&G.tm);G={st:0,sc:[0,0,0,0,0],pt:[0,0,0,0,0],lv:1};
 $("app").innerHTML=`<div class="card"><h2>Convierte un puesto caótico en uno de clase mundial</h2>${bub("mgr","El puesto de ensamble de la línea 2 está hecho un desorden: se pierden herramientas y hay accidentes. Tienen un turno para aplicar las <b>5S</b>, y cada etapa tiene límite de tiempo.")}${bub("pe","5S: <b>Seiri</b> clasificar, <b>Seiton</b> ordenar, <b>Seiso</b> limpiar, <b>Seiketsu</b> estandarizar y <b>Shitsuke</b> mantener la disciplina.")}${bub("op","En <b>Experto</b> hay menos tiempo, más objetos y las estrellas exigen casi perfección. ¿Se animan?")}<button class="main" onclick="G.lv=1;go(0)">🟢 Empezar en Normal</button><button class="main" style="background:#b91c1c;border-color:#b91c1c" onclick="G.lv=2;go(0)">🔴 Empezar en Experto</button></div>`}
function go(n){G.st=n;G.tl=0;[s1,s2,s3,s4,s5][n]()}
function res(s,t,m,c,p){G.sc[G.st]=s;G.pt[G.st]=Math.max(0,p);if(s>=2)tune([523,659,784]);
 $("app").innerHTML=head()+`<div class="card"><h2>${t}</h2><div style="font-size:26px">${"⭐".repeat(s)}${"☆".repeat(3-s)} <small style="font-size:13px;color:var(--mut)">+${G.pt[G.st]} pts</small></div>${bub(c||"qa",m)}<button class="main" onclick="${G.st==4?"fin()":"go("+(G.st+1)+")"}">${G.st==4?"Ver resultado final":"Siguiente etapa →"}</button></div>`}
/* 1 Seiri */
const I1=[["🔧","Llave de ajuste",0],["📏","Calibrador vigente",0],["🧤","Guantes nuevos",0],["🔩","Tornillos M8",0],["📋","Orden de trabajo vigente",0],["🔦","Linterna",0],["🧰","Repuestos del turno",0],["🍔","Comida vieja",1],["📦","Caja vacía",1],["📰","Periódico",1],["🧦","Calcetín",1],["☕","Taza sucia",1],["🪫","Batería agotada",1],["📄","Orden de trabajo vieja",1],["🧴","Frasco vacío",1],["🔧","Llave rota",2],["📏","Calibrador vencido",2],["🧤","Guantes rotos",2],["🔌","Cable pelado",2]];
const TG=["conservar (sin etiqueta)","🏷️ roja (descartar)","🟡 amarilla (reparar o recalibrar)"];
function s1(){const rv=sh(I1.filter(x=>x[2]==2)).slice(0,D()?3:2),rest=sh(I1.filter(x=>x[2]!=2)).slice(0,(D()?18:15)-rv.length);G.i=sh([...rv,...rest]).map(x=>({e:x[0],n:x[1],x:x[2],t:-1}));G.ix=0;r1();tmr(D()?30000:42000,d1)}
function r1(){const x=G.i[G.ix],n=G.i.length;$("app").innerHTML=head()+`<div class="card"><h2>1 · Seiri: clasificar</h2>${G.ix==0?bub("pe","Este puesto ensambla motores pequeños. Decide qué hacer con cada objeto: <b>conservar</b> si se necesita, <b>descartar</b> si no sirve, o <b>revisar</b> si está dañado (reparar o recalibrar). ¡Rápido!"):""}${TB()}<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--mut)"><span>Objeto ${G.ix+1} de ${n}</span><span>${G.i.slice(0,G.ix).map(()=>"●").join("")}${G.i.slice(G.ix).map(()=>"○").join("")}</span></div><div class="big"><div style="font-size:64px">${x.e}</div><div style="font-weight:700">${x.n}</div></div><div class="row3"><button onclick="c1(0)">✅<br>Conservar</button><button onclick="c1(1)">🏷️<br>Descartar</button><button onclick="c1(2)">🟡<br>Revisar</button></div><button style="width:100%;margin-top:8px" ${G.ix?"":"disabled"} onclick="u1()">↩️ Deshacer el anterior</button></div>`}
function c1(t){G.i[G.ix].t=t;beep(500,.05);G.ix++;if(G.ix>=G.i.length)return d1();r1()}
function u1(){if(G.ix>0){G.ix--;G.i[G.ix].t=-1;r1()}}
function d1(){clearInterval(G.tm);const n=G.i.length,w=G.i.filter(x=>x.t!=x.x),ok=n-w.length;
 res(stR(ok/n),`Acertaste ${ok} de ${n}`,w.length?`Fallaste en: ${w.map(x=>`${x.e} ${x.n} → debía ser ${TG[x.x]}`).join("; ")}. Lo dañado no se tira ni se deja: se etiqueta para reparar.`:"¡Clasificación perfecta! Solo queda lo necesario y lo dudoso quedó identificado.","pe",ok*50-w.length*25+Math.round(left()*100))}
/* 2 Seiton */
const I2=[["🔩","Tornillos","Se usan en cada pieza",0],["🧤","Guantes","Se usan en cada pieza",0],["🔧","Llave","Varias veces por hora",1],["📏","Calibrador","Se usa cada hora",1],["✏️","Marcador","Varias veces por hora",1],["📋","Orden de trabajo","Se consulta al iniciar el turno",2],["🔦","Linterna","Una vez por semana",2],["📘","Manual del equipo","Consulta ocasional",2],["🧴","Solvente inflamable","Peligroso: riesgo de incendio",3],["🔋","Baterías de litio","Riesgo de incendio si se dañan",3]];
const Z2=["✋ Al alcance de la mano","🧰 Tablero cercano","🗄️ Estante","🔥 Gabinete de seguridad"],CP=[2,3,3,2];
function s2(){const g=k=>sh(I2.filter(x=>x[3]==k));G.p=[...g(0),...g(1).slice(0,D()?3:2),...g(2).slice(0,D()?3:2),...g(3)].map(x=>({e:x[0],n:x[1],u:x[2],z:x[3],at:-1}));G.p=sh(G.p);G.sel=-1;G.msg="";r2();tmr(D()?38000:50000,d2)}
function r2(){const un=G.p.map((x,i)=>[x,i]).filter(q=>q[0].at<0);
 $("app").innerHTML=head()+`<div class="card"><h2>2 · Seiton: ordenar</h2>${bub("pe","«Un lugar para cada cosa y cada cosa en su lugar.» Lo que más se usa va más cerca, y lo peligroso va al gabinete. Cada zona tiene capacidad limitada. Toca un objeto y luego su zona.")}${TB()}<div style="color:var(--bad);font-size:13px;min-height:18px">${G.msg}</div><div class="grid">${un.map(q=>`<button class="it ${G.sel==q[1]?"sel":""}" onclick="G.sel=${q[1]};r2()"><span>${q[0].e}</span><small>${q[0].n}</small><small style="color:var(--mut)">${q[0].u}</small></button>`).join("")}</div>${Z2.map((z,k)=>`<button class="zone" onclick="z2(${k})"><b>${z}</b> <small style="color:var(--mut)">(${G.p.filter(x=>x.at==k).length}/${CP[k]})</small><div>${G.p.filter(x=>x.at==k).map(x=>x.e).join(" ")}</div></button>`).join("")}</div>`}
function z2(k){if(G.sel<0)return;if(G.p.filter(x=>x.at==k).length>=CP[k]){G.msg="Esa zona está llena (máx. "+CP[k]+"). Piensa dónde va realmente.";beep(120,.12,"sawtooth");return r2()}G.p[G.sel].at=k;G.sel=-1;G.msg="";beep(600,.05);if(G.p.every(x=>x.at>=0))return d2();r2()}
function d2(){clearInterval(G.tm);const n=G.p.length,w=G.p.filter(x=>x.at!=x.z),ok=n-w.length;
 res(ok==n?3:ok>=n-(D()?1:2)?2:ok>=n*.5?1:0,`Colocaste bien ${ok} de ${n}`,w.length?`Revisa: ${w.map(x=>`${x.e} ${x.n} iba en «${Z2[x.z]}»${x.at<0?" (sin colocar)":""}`).join("; ")}. Cuanto más se usa, más cerca; lo peligroso, en su gabinete.`:"¡Perfecto! Todo está donde se necesita y se ve a simple vista cuando falta algo.","pe",ok*60-w.length*20+Math.round(left()*100))}
/* 3 Seiso */
function s3(){const T=14000,sp=D()?320:450,life=D()?1700:2400;G.cl=0;G.lk=0;G.sp=[];G.nid=0;G.sn=0;G.nx=0;G.lkIdx=sh([...Array(D()?38:25).keys()]).slice(0,3);G.t0=Date.now();
 $("app").innerHTML=head()+`<div class="card"><h2>3 · Seiso: limpiar</h2>${bub("op","Limpiar es inspeccionar. Toca las manchas 🟤 antes de que se esparzan, y si ves una fuga 💧, ¡avisa a mantenimiento! Aparecen sin parar durante 14 segundos.")}${TB()}<div class="desk" id="desk"></div></div>`;
 clearInterval(G.tm);G.tm=setInterval(()=>{const now=Date.now(),el=now-G.t0,b=$("tb");if(b)b.style.width=Math.max(0,(1-el/T)*100)+"%";
  if(el<T-life&&now>=G.nx){G.nx=now+sp;const lk=G.lkIdx.includes(G.sn++),s={id:G.nid++,x:4+Math.random()*84,y:4+Math.random()*78,lk,b:now,d:0};G.sp.push(s);$("desk").insertAdjacentHTML("beforeend",`<span class="sp ${lk?"lk":""}" id="sp${s.id}" style="left:${s.x}%;top:${s.y}%" onclick="t3(${s.id})">${lk?"💧":"🟤"}</span>`)}
  G.sp.forEach(s=>{if(!s.d&&now-s.b>(s.lk?life+800:life)){s.d=1;$("sp"+s.id).remove()}});
  if(el>=T)d3()},100)}
function t3(id){const s=G.sp.find(x=>x.id==id);if(!s||s.d)return;s.d=1;if(s.lk)G.lk++;else G.cl++;const e=$("sp"+id);e.textContent=s.lk?"📣":"✨";e.className+=" fade";beep(s.lk?880:700,.06);setTimeout(()=>e.remove(),300)}
function d3(){clearInterval(G.tm);const dirt=G.sp.filter(x=>!x.lk).length,lks=G.sp.filter(x=>x.lk).length,r=(G.cl+2*G.lk)/Math.max(1,dirt+2*lks);
 res(r>=(D()?.9:.85)?3:r>=(D()?.7:.65)?2:r>=(D()?.45:.4)?1:0,`Limpiaste ${G.cl} de ${dirt} manchas`,`Reportaste ${G.lk} de ${lks} fugas. ${G.lk<lks?"Las fugas son señales tempranas de averías: limpiar es una forma de inspeccionar.":"Detectar fugas mientras limpias evita paros de línea."}`,"op",G.cl*30+G.lk*80)}
/* 4 y 5 */
const Q4=[["¿Cómo logras que todos mantengan el mismo orden sin explicarlo cada vez?","Con etiquetas, colores y siluetas (controles visuales)","Pidiéndoles que se acuerden","Cambiando al personal","Los controles visuales hacen que el estándar se vea."],["El tablero tiene siluetas dibujadas. ¿Para qué sirven?","Para ver al instante si falta una herramienta","Para decorar el puesto","Para reducir el peso","La silueta muestra qué falta y dónde va cada herramienta."],["Un buen estándar 5S debe ser…","Simple, visible y fácil de seguir","Largo y muy detallado","Conocido solo por el supervisor","Si no es simple y visible, la gente no lo sigue."],["¿Quién completa la lista de verificación 5S del puesto?","Los operadores de ese puesto","Solo el gerente","Nadie, es opcional","Quien trabaja en el puesto es dueño del estándar."],["Dos turnos guardan las herramientas en lugares distintos. ¿Qué falta?","Un estándar común con fotos del estado ideal","Más supervisión","Eliminar un turno","Un estándar único evita que cada turno improvise."],["Una línea amarilla en el piso sirve para…","Delimitar zonas y pasillos para no invadirlos","Marcar dónde pintar después","Dejar cajas temporales","Los límites visuales protegen la circulación y el orden."],["¿Qué hace útil una foto del estado ideal en el puesto?","Muestra cómo debe verse y permite comparar al instante","Mejora la iluminación","Reemplaza la limpieza","Comparar con una foto detecta desviaciones sin explicaciones."],["Cambian el diseño de la línea. ¿Qué haces con el estándar 5S?","Actualizarlo y comunicarlo a todos","Ignorarlo hasta la auditoría","Eliminarlo","Un estándar desactualizado deja de servir."]];
const Q5=[["El puntaje de auditoría 5S baja semana a semana. ¿Causa más probable?","Se dejaron las auditorías y el seguimiento","El método 5S no funciona","Los operadores no saben limpiar","Sin seguimiento los hábitos se pierden: suele fallar la disciplina, no el método."],["¿Qué sostiene el hábito en el tiempo?","Auditorías periódicas, reconocimiento y líderes que den el ejemplo","Una multa a quien falle","Repetir el curso una vez al año","Medir, reconocer y dar el ejemplo refuerza la conducta."],["Marta quiere resultados rápidos. ¿Qué le dices?","5S es un hábito: se mide y se refuerza cada turno","Es un proyecto de una semana","Mejor dejarlo, es costoso","Shitsuke es cultura, no solo orden."],["Un supervisor deja su escritorio desordenado y pide orden al equipo. ¿Efecto?","Pierde credibilidad: el ejemplo del líder es clave","Ninguno","El equipo se esfuerza más","La disciplina se contagia con el ejemplo."],["Tras un mes, nadie hace la limpieza de cierre de turno. ¿Primera acción?","Entender por qué (tiempo, herramientas, prioridades) y corregirlo","Sancionar a todos","Quitar el paso del estándar","Primero se busca la causa raíz."],["¿Cómo reconocer a los equipos que mantienen las 5S?","Con resultados visibles y reconocimiento público","Dándoles más trabajo","No hace falta reconocer","El reconocimiento refuerza la conducta."],["Una auditoría 5S sorpresa sirve para…","Ver la realidad y mejorar, no para castigar","Encontrar culpables","Cumplir un trámite","Una auditoría es para aprender y mejorar."],["Shitsuke significa…","Disciplina: convertir el hábito en cultura","Limpieza profunda","Orden de los materiales","Es la más difícil de las 5S."]];
function quiz(pool,n,m,c,t){G.q=sh(pool).slice(0,n).map(x=>{const o=sh([x[1],x[2],x[3]]);return[x[0],o,o.indexOf(x[1]),x[4]]});G.qi=0;G.qo=0;G.qm=m;G.qc=c;G.qt=t;G.qp=0;rq()}
function rq(){G.tl=0;const q=G.q[G.qi];$("app").innerHTML=head()+`<div class="card"><h2>${G.st+1} · ${STG[G.st][0]}: ${STG[G.st][1].toLowerCase()}</h2>${G.qi==0?bub(G.qc,G.qm):""}${TB()}<p style="margin:8px 0 2px"><b>Pregunta ${G.qi+1}/${G.q.length}:</b> ${q[0]}</p>${q[1].map((o,i)=>`<button class="opt" onclick="qa(${i})">${o}</button>`).join("")}</div>`;tmr(G.qt,()=>qa(-1))}
function qa(i){clearInterval(G.tm);const q=G.q[G.qi],ok=i==q[2];if(ok){G.qo++;G.qp+=80+Math.round(left()*60)}beep(ok?660:120,.1,ok?"square":"sawtooth");
 $("app").innerHTML=head()+`<div class="card"><div class="mcard ${ok?"":"bad"}">${ok?"✅ Correcto":i<0?"⏰ Se acabó el tiempo":"❌ No exactamente"}</div>${bub("qa",q[3])}<button class="main" onclick="nq()">Continuar →</button></div>`}
function nq(){G.qi++;if(G.qi<G.q.length)return rq();const n=G.qo,t=G.q.length;res(n==t?3:n>=t-1?2:n>=Math.ceil(t*.6)?1:0,`Respondiste bien ${n} de ${t}`,n==t?"¡Muy bien! Estas ideas sostienen el orden en el tiempo.":"Repasa las explicaciones: la clave es que el estándar sea visible y que haya seguimiento.","qa",G.qp)}
