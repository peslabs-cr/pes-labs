<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$("cv"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener("resize",resize);resize();
// ---------- utilidades ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const TW=32,TH=16;
const P=(x,y,z=0)=>[(x-y)*TW,(x+y)*TH-z];
function hex(c){c=c.replace("#","");if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function sh(c,k){const [r,g,b]=hex(c);const f=v=>Math.round(clamp(v*k,0,255));return `rgb(${f(r)},${f(g)},${f(b)})`}
function poly(pts,fill,stroke){cx.beginPath();cx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)cx.lineTo(pts[i][0],pts[i][1]);cx.closePath();if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=1;cx.stroke()}}
// caja isométrica con mugre
function box(x,y,w,d,h,col,z0=0,o={}){
 const A=P(x,y,z0),B=P(x+w,y,z0),C=P(x+w,y+d,z0),D=P(x,y+d,z0),Ah=P(x,y,z0+h),Bh=P(x+w,y,z0+h),Ch=P(x+w,y+d,z0+h),Dh=P(x,y+d,z0+h);
 poly([D,C,Ch,Dh],sh(col,.62));poly([C,B,Bh,Ch],sh(col,.82));poly([Ah,Bh,Ch,Dh],o.top||sh(col,1.05));
 // mugre: degradado inferior
 if(h>8&&!o.clean){const g=cx.createLinearGradient(0,D[1],0,Dh[1]);g.addColorStop(0,"rgba(20,14,8,.45)");g.addColorStop(.5,"rgba(20,14,8,0)");poly([D,C,B,Bh,Ch,Dh],g);}
 if(o.win){// ventanas
  const n=o.win, lit=o.lit;
  for(let i=0;i<n;i++){const t=(i+.5)/n;for(const lv of (o.lv||[.55])){
   const p1=P(x+w,y+d*t-.12,z0+h*lv),p2=P(x+w,y+d*t+.12,z0+h*lv);const q=P(x+w*t-.12,y+d,z0+h*lv),q2=P(x+w*t+.12,y+d,z0+h*lv);
   cx.strokeStyle=lit?`rgba(255,${200+((i*37)%40)},120,${.55+.4*NIGHT})`:"rgba(30,40,50,.9)";cx.lineWidth=3.2;
   cx.beginPath();cx.moveTo(p1[0],p1[1]);cx.lineTo(p2[0],p2[1]);cx.stroke();cx.beginPath();cx.moveTo(q[0],q[1]);cx.lineTo(q2[0],q2[1]);cx.stroke();}}
 }
 if(o.rust){cx.strokeStyle="rgba(110,60,25,.35)";cx.lineWidth=1.5;for(let i=0;i<o.rust;i++){const t=(i*0.37+0.13)%1;const a=P(x+w,y+d*t,z0+h*.95),b=P(x+w,y+d*t,z0+h*(.3+.4*((i*.53)%1)));cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke();}}
}
// tanque cilíndrico
function cyl(x,y,r,h,col,z0=0,o={}){
 const [sx,sy]=P(x,y,z0),rx=r*TW*1.414,ry=r*TH*1.414,ty=sy-h;
 const g=cx.createLinearGradient(sx-rx,0,sx+rx,0);g.addColorStop(0,sh(col,.45));g.addColorStop(.35,sh(col,.95));g.addColorStop(.6,sh(col,.8));g.addColorStop(1,sh(col,.4));
 cx.fillStyle=g;cx.beginPath();cx.moveTo(sx-rx,ty);cx.lineTo(sx-rx,sy);cx.ellipse(sx,sy,rx,ry,0,Math.PI,0,true);cx.lineTo(sx+rx,ty);cx.closePath();cx.fill();
 // mugre y óxido
 const g2=cx.createLinearGradient(0,sy+ry,0,ty);g2.addColorStop(0,"rgba(25,15,5,.55)");g2.addColorStop(.45,"rgba(25,15,5,0)");cx.fillStyle=g2;
 cx.beginPath();cx.moveTo(sx-rx,ty);cx.lineTo(sx-rx,sy);cx.ellipse(sx,sy,rx,ry,0,Math.PI,0,true);cx.lineTo(sx+rx,ty);cx.closePath();cx.fill();
 if(o.rust!==0){cx.strokeStyle="rgba(120,62,22,.4)";cx.lineWidth=2;for(let i=0;i<(o.rust||5);i++){const a=-.85+1.7*((i*0.618+x*.1)%1),xx=sx+rx*a,yy=ty+ry*Math.sqrt(1-a*a)*.9;cx.beginPath();cx.moveTo(xx,yy);cx.lineTo(xx,yy+h*(.25+.5*((i*.41)%1)));cx.stroke();}}
 if(o.bands){cx.strokeStyle="rgba(0,0,0,.25)";cx.lineWidth=1;for(let k=1;k<o.bands;k++){const yy=sy-h*k/o.bands;cx.beginPath();cx.ellipse(sx,yy,rx,ry,0,0,Math.PI);cx.stroke();}}
 if(o.stripe){cx.fillStyle=o.stripe;cx.beginPath();const y1=sy-h*.62,y2=sy-h*.5;cx.moveTo(sx-rx,y1);cx.ellipse(sx,y1,rx,ry,0,Math.PI,0,true);cx.lineTo(sx+rx,y2);cx.ellipse(sx,y2,rx,ry,0,0,Math.PI);cx.closePath();cx.fill();}
 cx.fillStyle=o.top||sh(col,.75);cx.beginPath();cx.ellipse(sx,ty,rx,ry,0,0,Math.PI*2);cx.fill();
 if(o.roof!==false){cx.strokeStyle="rgba(0,0,0,.3)";cx.beginPath();cx.ellipse(sx,ty,rx*.6,ry*.6,0,0,Math.PI*2);cx.stroke();}
 if(o.level!=null){// indicador de nivel
  const lx=sx+rx*.55,lh=h*.8,ly=sy-h*.1;cx.fillStyle="rgba(0,0,0,.55)";cx.fillRect(lx-3,ly-lh,6,lh);cx.fillStyle=o.level>.9||o.level<.12?"#ff6b4a":"#e8b04a";cx.fillRect(lx-2,ly-lh*o.level,4,lh*o.level);}
 return [sx,ty];
}
function sphere(x,y,r,z,col){const [sx,sy]=P(x,y,0),R=r*TW*1.1;
 cx.strokeStyle="#3b3a36";cx.lineWidth=3;for(const a of[-.7,-.25,.25,.7]){cx.beginPath();cx.moveTo(sx+R*a,sy-z+R*.3);cx.lineTo(sx+R*a*1.1,sy+R*.25*Math.abs(a));cx.stroke();}
 const g=cx.createRadialGradient(sx-R*.35,sy-z-R*.4,R*.1,sx,sy-z,R);g.addColorStop(0,sh(col,1.15));g.addColorStop(.7,sh(col,.75));g.addColorStop(1,sh(col,.4));
 cx.fillStyle=g;cx.beginPath();cx.arc(sx,sy-z,R,0,7);cx.fill();
 cx.strokeStyle="rgba(100,55,20,.35)";cx.lineWidth=1.5;for(let i=0;i<4;i++){cx.beginPath();cx.moveTo(sx-R*.5+i*R*.3,sy-z+R*.2);cx.lineTo(sx-R*.5+i*R*.3,sy-z+R*.75);cx.stroke();}
 return [sx,sy-z-R];}
function pipeLine(pts,col,wd,flow,spd){
 const s=pts.map(p=>P(p[0],p[1],p[2]||0));cx.lineCap="round";cx.lineJoin="round";
 cx.strokeStyle="rgba(0,0,0,.35)";cx.lineWidth=wd+2;cx.beginPath();s.forEach((p,i)=>i?cx.lineTo(p[0],p[1]+1):cx.moveTo(p[0],p[1]+1));cx.stroke();
 cx.strokeStyle=col;cx.lineWidth=wd;cx.beginPath();s.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.stroke();
 if(flow){cx.setLineDash([3,9]);cx.lineDashOffset=-T*(spd||22);cx.strokeStyle=flow;cx.lineWidth=Math.max(1.2,wd*.45);cx.beginPath();s.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.stroke();cx.setLineDash([]);}
}
// ---------- estado del juego ----------
const S={t:6*60,day:1,money:0,shiftMoney:0,safeH:0,F:90,Tf:355,R:1.8,o2:3,foul:.25,salt:.2,crude:"Liviano",crudeLvl:.62,tk:{gas:.5,naf:.45,ker:.5,die:.55,res:.5},spd:1,
 res:{ok:0,bad:0,ign:0},seg:70,conf:60,ss:{acc:0,ign:0,meas:0,ok:0},up:{},gm:0,camp:null,trust:{},dilDone:[],foulRate:1,wells:Array(13).fill(1),pipe:1,down:{},rig:.35,newWells:0,shiftLog:[],trip:0,coke:0,started:false,tut:0,cool:1,dieOff:false,flare:0,leak:0};
let SPD=1,T=0,NIGHT=0;
const PRICE={gas:40,naf:85,ker:95,die:98,res:60,crude:75};
const NAMES={gas:"GLP y gas",naf:"Nafta (gasolina)",ker:"Queroseno (jet)",die:"Diésel",res:"Residuo (búnker)"};
const PCOL={gas:"#7fc4ff",naf:"#ffd166",ker:"#9be08f",die:"#ff9f43",res:"#a0705a"};
function yields(){
 const base=S.crude==="Liviano"?{gas:3,naf:22,ker:14,die:26}:{gas:2,naf:15,ker:11,die:24};
 const dT=(S.Tf-355)/10;const y={gas:base.gas,naf:base.naf,ker:base.ker+dT*1,die:base.die+dT*2};
 if(S.R<1.3){y.naf-=2;y.ker+=1;y.die+=1}
 y.res=100-y.gas-y.naf-y.ker-y.die;return y;}
function preheatT(){return 262-45*S.foul}
function furnEff(){return clamp(.9-Math.abs(S.o2-3)*.022-(S.o2<1.5?.06:0),.6,.92)}
function fuelCost(){return (S.Tf-preheatT())*.0125/furnEff()*.9*(S.up&&S.up.aph?.85:1)} // $/bbl
function fieldRate(){const on=S.wells.reduce((a,b)=>a+b,0);return (on*4.6+S.newWells*3+12)*S.pipe*(S.up&&S.up.esp?1.08:1)}
function rates(){// $/h
 let F=S.F*(S.trip>0?.6:1);if(S.down.claus)F=Math.min(F,75);const y=yields(),bblh=F*1000/24;let v=0;
 for(const k in y){let p=PRICE[k];if(k==="die"){if(S.dieOff)p=PRICE.res+4;else if(S.down.hdt)p=PRICE.die-12;}v+=y[k]/100*p}
 if(!S.down.fcc&&!S.down.boiler)v+=2;if(S.up.vfd)v+=.2;if(S.up.cogen)v+=.6;if(!S.down.refo)v+=.7;if(S.down.boiler)v-=1.2;
 const fr=fieldRate(),frac=Math.min(1,fr/Math.max(F,1)),cc=70*frac+PRICE.crude*(1-frac);
 const m=(v-cc-fuelCost())*bblh;let pen=0;for(const i of INC)pen+=(i.pen||0);
 return {m:m-pen,F,bblh,y,fr};}
// ---------- mapa ----------
const MAP=28;
const U={};// unidades
function unit(id,o){U[id]=Object.assign({id},o);}
unit("muelle",{x:2.2,y:23.5,w:4.5,d:2.6,nm:"Muelle y barco de crudo",ic:"⚓",art:null,info:"Aquí atracan los barcos que traen el petróleo crudo. Una refinería necesita inventario de crudo para varios días: si el barco se atrasa, hay que bajar la carga para estirar el tanque."});
unit("tkc1",{x:6,y:18.6,nm:"Tanques de crudo",ic:"🛢️",info:"Guardan el crudo antes de procesarlo. En el fondo se separa agua y sedimentos que se drenan. El nivel bajo es peligroso para la bomba de carga: reduce la presión en la succión (NPSH)."});
unit("bomba",{x:9.6,y:16.6,w:1.4,d:1.2,nm:"Bomba de carga",ic:"💧",sim:"../procesos/bomba.html",art:"bombas",info:"Bombas centrífugas que mandan el crudo a toda la planta. Si la presión en la succión baja de la presión de vapor, el líquido hierve dentro de la bomba: cavitación."});
unit("pre",{x:10.6,y:12.6,w:4.2,d:1.4,nm:"Tren de precalentamiento",ic:"🔥",sim:"../procesos/intercambiador.html",art:"intercambiador",info:"Intercambiadores de calor que calientan el crudo con los productos calientes que salen de la torre. Cada grado que se gana aquí es combustible que el horno no quema. El ensuciamiento les roba calor mes a mes."});
unit("desal",{x:11.2,y:9.4,w:2.6,d:1.1,nm:"Desaladora",ic:"🧂",info:"Mezcla el crudo con agua de lavado y separa la salmuera con un campo eléctrico. Si la sal pasa, se forma ácido clorhídrico en el tope de la torre y corroe los equipos."});
unit("horno",{x:14.6,y:7.2,w:2.6,d:2.2,nm:"Horno de crudo",ic:"♨️",info:"Calienta el crudo hasta unos 350–370 °C para vaporizar parte de él. Es el mayor consumidor de energía de la unidad. El exceso de aire (oxígeno en gases) define su eficiencia: poco aire hace humo, mucho aire calienta aire."});

unit("aero",{x:20.8,y:3.2,w:3,d:1.6,nm:"Condensador y acumulador",ic:"🌀",info:"Condensa los vapores del tope de la torre. Parte del líquido regresa como reflujo; el resto es nafta. Si no condensa bien, sube la presión de la torre."});
unit("enf",{x:8.4,y:3,w:3.2,d:2.6,nm:"Torre de enfriamiento",ic:"🌫️",info:"Enfría el agua que usan los condensadores y enfriadores, evaporando una parte. En las tardes calientes enfría menos, y la planta lo siente."});
unit("ant",{x:3.2,y:4.6,nm:"Antorcha (flare)",ic:"🔥",info:"Quema de forma segura los gases que liberan las válvulas de alivio. Es un equipo de seguridad: una llama grande o humo negro indican que algo está aliviando en la planta."});
unit("tkp",{x:13.6,y:20.4,nm:"Tanques de productos",ic:"🏭",info:"Guardan la nafta, el queroseno, el diésel y el residuo hasta que se despachan por camión o barco. Un tanque lleno obliga a bajar la carga de la planta."});
unit("glp",{x:21.6,y:13.4,nm:"Esferas de GLP",ic:"🔵",info:"El gas licuado se guarda a presión en esferas, porque así ocupa mucho menos espacio. Son zonas de máxima seguridad: nada de chispas."});
unit("rack",{x:19.4,y:19.6,w:3.2,d:2.2,nm:"Llenadero de camiones",ic:"🚚",info:"Aquí se cargan los camiones cisterna con gasolina y diésel. La logística también es parte del proceso: si los camiones no salen, los tanques se llenan."});
unit("ctrl",{x:6.6,y:11.4,w:2.6,d:2.2,nm:"Sala de control",ic:"🎛️",info:"Desde aquí los operadores controlan la planta con el sistema de control distribuido (DCS). Tú, como ingeniero de procesos, decides los ajustes y resuelves problemas."});
unit("ofi",{x:3.2,y:9.6,w:2.4,d:3,nm:"Oficinas y comedor",ic:"🏢",info:"Oficinas de ingeniería, mantenimiento y el comedor. La comunicación entre turnos y áreas es parte de la seguridad."});
unit("bomb",{x:6.4,y:15.2,w:2.2,d:1.6,nm:"Estación de bomberos",ic:"🚒",info:"Brigada contra incendios de la refinería, lista las 24 horas."});
unit("sub",{x:15.2,y:2.2,w:2.4,d:1.8,nm:"Subestación eléctrica",ic:"⚡",info:"Recibe la energía de la red y la distribuye a motores, bombas y ventiladores."});
unit("agua",{x:22.4,y:23.4,w:3.2,d:2.4,nm:"Tratamiento de aguas",ic:"💦",info:"Separa el aceite del agua de proceso antes de devolverla al ambiente. Lo que entra sucio debe salir dentro de los límites de la ley."});
unit("vacio",{x:22.6,y:8.6,nm:"Unidad de vacío",ic:"🏗️",info:"Destila el residuo de la torre atmosférica a presión muy baja. Al bajar la presión, los componentes pesados hierven a menor temperatura y se sacan gasóleos sin coquizar el crudo."});
unit("rackp",{x:9,y:11,nm:"Rack de tuberías",ic:"🧱",info:"La «autopista» de la refinería: decenas de tuberías de crudo, productos, vapor, agua y aire viajan juntas sobre estructuras de acero. Cada color de línea lleva un fluido distinto."});

function caseById(id){return CASES.find(c=>c.id===id)}
function spawn(id){const c=caseById(id);if(!c||INC.find(i=>i.c.id===id))return;
 if(S.tut&&!c.safety&&S.conf>=80&&rnd()<.2){meter("conf",1);toast(`👵 <b>Doña Marta</b> detectó a tiempo «${c.t}» y lo corrigió con su equipo. ¡La confianza paga!`);return;}
 if(c.pre)c.pre();const i={id:incId++,c,t0:S.t,pen:c.pen,seen:false,dl:c.dl*dlMult()*(c.safety&&S.up&&S.up.det?1.5:1)};INC.push(i);beep(880,.08);updInc();
 toast(`❗ <b>${U[c.u].nm}:</b> ${c.t}${S.conf>=70?" <span class='mut'>(te avisaron temprano)</span>":""}`);return i;}
function updInc(){const n=$("ninc");n.hidden=!INC.length;n.textContent=INC.length;}

function face(id,sz=56){const c=CHARS[id];let s=`<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" style="flex:none;border-radius:50%;background:#2a241e;border:2px solid #c97a1c">`;
 s+=`<path d="M8 64 Q10 46 32 44 Q54 46 56 64Z" fill="${c.v}"/><path d="M26 44 L32 52 L38 44Z" fill="#e8e4dc"/><rect x="27" y="36" width="10" height="9" fill="${c.sk}"/>`;
 if(c.a==="long")s+=`<path d="M17 30 Q16 50 24 50 L24 26Z M47 30 Q48 50 40 50 L40 26Z" fill="${c.hr}"/>`;
 if(c.a==="bun")s+=`<circle cx="32" cy="12" r="7" fill="${c.hr}"/>`;

 if(!c.hat||c.a==="bun")s+=`<path d="M19 26 Q20 13 32 13 Q44 13 45 26 Q40 19 32 19 Q24 19 19 26Z" fill="${c.hr}"/>`;
 s+=`<circle cx="27" cy="29" r="1.8" fill="#222"/><circle cx="37" cy="29" r="1.8" fill="#222"/><path d="M28 36 Q32 39 36 36" stroke="#5a2a1a" stroke-width="1.6" fill="none"/>`;
 if(c.a==="beard")s+=`<path d="M20 31 Q22 44 32 44 Q42 44 44 31 Q40 38 32 38 Q24 38 20 31Z" fill="${c.hr}" opacity=".9"/>`;

 if(c.a==="glasses")s+=`<circle cx="27" cy="29" r="4" stroke="#222" stroke-width="1.4" fill="none"/><circle cx="37" cy="29" r="4" stroke="#222" stroke-width="1.4" fill="none"/><path d="M31 29h2" stroke="#222" stroke-width="1.4"/>`;
 if(c.hat==="straw")s+=`<ellipse cx="32" cy="18" rx="20" ry="4" fill="#d8c48a"/><path d="M22 18 Q23 8 32 8 Q41 8 42 18Z" fill="#cdb878"/><rect x="22" y="15" width="20" height="2" fill="#7a5a3a"/>`;
 else if(c.hat&&c.a!=="bun")s+=`<path d="M17 22 Q18 9 32 9 Q46 9 47 22Z" fill="${c.hat}"/><rect x="15" y="21" width="34" height="3" rx="1.5" fill="${c.hat}"/><rect x="30" y="9" width="4" height="13" fill="rgba(0,0,0,.12)"/>`;

unit("rig",{x:-27,y:6,nm:"Torre de perforación",ic:"🏗️",info:"Perfora pozos nuevos. La broca gira al fondo de una sarta de tubería y el lodo de perforación baja por dentro, enfría la broca, sube los recortes y, con su peso, mantiene controlada la presión del yacimiento. El BOP (preventor de reventones) es la última barrera de seguridad."});
unit("jacks",{x:-27,y:17.5,nm:"Pozos con bomba de balancín",ic:"🐴",info:"Cuando el yacimiento ya no tiene presión para que el petróleo suba solo, se usa levantamiento artificial. El balancín sube y baja una varilla que acciona una bomba en el fondo del pozo."});
unit("sep",{x:-14,y:16.6,nm:"Estación de separación",ic:"🫧",info:"Lo que sale del pozo es una mezcla de petróleo, gas y agua. Los separadores trifásicos los separan por densidad: el gas sale por arriba, el agua por abajo y el petróleo en medio."});
unit("gas",{x:-12,y:9,nm:"Planta de gas",ic:"☠️",info:"Trata el gas asociado: lo deshidrata y le quita el H₂S con aminas (endulzamiento). El H₂S es extremadamente tóxico: a concentraciones altas paraliza el olfato y puede matar en minutos. Por eso hay detectores y mangas de viento."});
unit("pipe",{x:-4,y:14.6,nm:"Oleoducto y estación de bombeo",ic:"🛤️",info:"Lleva el crudo del campo a la refinería. Cada cierto tiempo se envía un «chancho» (pig) por dentro del tubo para limpiarlo de parafina y agua. Cerrar una válvula de golpe provoca golpe de ariete."});
unit("plat",{x:-16,y:32.5,nm:"Plataforma marina",ic:"🌊",info:"Produce petróleo desde pozos bajo el mar. Todo llega por helicóptero o barco de abastecimiento, y la seguridad del personal depende del clima."});
unit("fcc",{x:32,y:5.6,nm:"Craqueo catalítico (FCC)",ic:"⚙️",info:"Convierte gasóleos pesados en gasolina y GLP rompiendo las moléculas con un catalizador en polvo muy caliente. El catalizador circula entre el reactor y el regenerador, donde se le quema el coque."});
unit("refo",{x:39,y:5,nm:"Reformadora catalítica",ic:"🔺",info:"Transforma la nafta pesada en un componente de gasolina de alto octanaje, y de paso produce hidrógeno que usa el hidrotratamiento."});
unit("hdt",{x:43.4,y:5.4,nm:"Hidrotratamiento de diésel",ic:"💨",info:"Quita el azufre del diésel con hidrógeno sobre un catalizador, a alta presión y temperatura. Así el diésel cumple la norma de bajo azufre."});
unit("claus",{x:32.6,y:13.6,nm:"Planta de azufre (Claus)",ic:"🟡",info:"Convierte el H₂S que se separa en la refinería en azufre sólido: se quema un tercio del H₂S y el resto reacciona con el SO₂ formado. Las montañas amarillas son azufre, un subproducto que se vende."});
unit("boiler",{x:38.8,y:13.4,nm:"Calderas y vapor",ic:"♨️",info:"Generan el vapor que usan casi todas las unidades: turbinas, despojamiento, calentamiento. Si cae el vapor, cae media refinería."});
unit("blend",{x:44,y:14,nm:"Planta de mezclas",ic:"🧪",info:"Mezcla los componentes (reformado, nafta de FCC, butano…) para obtener gasolinas que cumplan octanaje, presión de vapor y demás especificaciones."});
unit("tren",{x:40,y:26.3,nm:"Despacho por tren",ic:"🚆",info:"Los carros tanque llevan productos a otras regiones. Cargar un tren completo requiere coordinar el llenadero, la calidad y la seguridad."});

 for(const i of INC){if(i.bx!=null&&Math.hypot(wx-i.bx,wy-i.by)<24){incDlg(i);return}}
