const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const TW=32,TH=16;

function hex(c){c=c.replace("#","");if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function sh(c,k){const [r,g,b]=hex(c);const f=v=>Math.round(clamp(v*k,0,255));return `rgb(${f(r)},${f(g)},${f(b)})`}
function poly(pts,fill,stroke){cx.beginPath();cx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)cx.lineTo(pts[i][0],pts[i][1]);cx.closePath();if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=1;cx.stroke()}}

 poly([D,C,Ch,Dh],sh(col,.62));poly([C,B,Bh,Ch],sh(col,.82));poly([Ah,Bh,Ch,Dh],o.top||sh(col,1.05));
 // mugre: degradado inferior

 if(o.win){// ventanas

 }
 if(o.rust){cx.strokeStyle="rgba(110,60,25,.35)";cx.lineWidth=1.5;for(let i=0;i<o.rust;i++){const t=(i*0.37+0.13)%1;const a=P(x+w,y+d*t,z0+h*.95),b=P(x+w,y+d*t,z0+h*(.3+.4*((i*.53)%1)));cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke();}}

// tanque cilíndrico
function cyl(x,y,r,h,col,z0=0,o={}){
 const [sx,sy]=P(x,y,z0),rx=r*TW*1.414,ry=r*TH*1.414,ty=sy-h;

 cx.fillStyle=g;cx.beginPath();cx.moveTo(sx-rx,ty);cx.lineTo(sx-rx,sy);cx.ellipse(sx,sy,rx,ry,0,Math.PI,0,true);cx.lineTo(sx+rx,ty);cx.closePath();cx.fill();
 // mugre y óxido
 const g2=cx.createLinearGradient(0,sy+ry,0,ty);g2.addColorStop(0,"rgba(25,15,5,.55)");g2.addColorStop(.45,"rgba(25,15,5,0)");cx.fillStyle=g2;
 cx.beginPath();cx.moveTo(sx-rx,ty);cx.lineTo(sx-rx,sy);cx.ellipse(sx,sy,rx,ry,0,Math.PI,0,true);cx.lineTo(sx+rx,ty);cx.closePath();cx.fill();
 if(o.rust!==0){cx.strokeStyle="rgba(120,62,22,.4)";cx.lineWidth=2;for(let i=0;i<(o.rust||5);i++){const a=-.85+1.7*((i*0.618+x*.1)%1),xx=sx+rx*a,yy=ty+ry*Math.sqrt(1-a*a)*.9;cx.beginPath();cx.moveTo(xx,yy);cx.lineTo(xx,yy+h*(.25+.5*((i*.41)%1)));cx.stroke();}}
 if(o.bands){cx.strokeStyle="rgba(0,0,0,.25)";cx.lineWidth=1;for(let k=1;k<o.bands;k++){const yy=sy-h*k/o.bands;cx.beginPath();cx.ellipse(sx,yy,rx,ry,0,0,Math.PI);cx.stroke();}}
 if(o.stripe){cx.fillStyle=o.stripe;cx.beginPath();const y1=sy-h*.62,y2=sy-h*.5;cx.moveTo(sx-rx,y1);cx.ellipse(sx,y1,rx,ry,0,Math.PI,0,true);cx.lineTo(sx+rx,y2);cx.ellipse(sx,y2,rx,ry,0,0,Math.PI);cx.closePath();cx.fill();}
 cx.fillStyle=o.top||sh(col,.75);cx.beginPath();cx.ellipse(sx,ty,rx,ry,0,0,Math.PI*2);cx.fill();
 if(o.roof!==false){cx.strokeStyle="rgba(0,0,0,.3)";cx.beginPath();cx.ellipse(sx,ty,rx*.6,ry*.6,0,0,Math.PI*2);cx.stroke();}
 if(o.level!=null){// indicador de nivel
  const lx=sx+rx*.55,lh=h*.8,ly=sy-h*.1;cx.fillStyle="rgba(0,0,0,.55)";cx.fillRect(lx-3,ly-lh,6,lh);cx.fillStyle=o.level>.9||o.level<.12?"#ff6b4a":"#e8b04a";cx.fillRect(lx-2,ly-lh*o.level,4,lh*o.level);}

function sphere(x,y,r,z,col){const [sx,sy]=P(x,y,0),R=r*TW*1.1;

 cx.strokeStyle="rgba(100,55,20,.35)";cx.lineWidth=1.5;for(let i=0;i<4;i++){cx.beginPath();cx.moveTo(sx-R*.5+i*R*.3,sy-z+R*.2);cx.lineTo(sx-R*.5+i*R*.3,sy-z+R*.75);cx.stroke();}

}

function msNb(i){const n=9,x=i%n,y=(i-x)/n,r=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<n&&Y<n)r.push(Y*n+X)}return r}

function solAuto(){const s=PC.sol;let moved=true;while(moved){moved=false;if(s.waste.length){const x=s.waste[s.waste.length-1];if(canF(x,x.s)){s.f[x.s].push(s.waste.pop());moved=true;continue}}for(let c=0;c<7;c++){const t=s.t[c],x=t[t.length-1];if(x&&x.up&&canF(x,x.s)){s.f[x.s].push(t.pop());if(t.length)t[t.length-1].up=true;moved=true}}}s.sel=null;solCheck();}

 ${L.length?"<p><b>Bitácora de la noche:</b></p>"+L.map(x=>`<div class="mut">${x.ok==="dil"?"💬":x.ok==="part"?"🟡":x.ok===true?"✅":x.ok===false?"❌":"⏱️"} ${x.c.t} <i>(${x.c.tag})</i></div>`).join(""):""}

const CAM={x:0,y:0,z:1};function fitCam(){const c=P(W<700?11:17,W<700?11:11);CAM.x=c[0];CAM.y=c[1]-40;CAM.z=W<700?.72:clamp(Math.min(W/1250,H/760),.5,1.2);}
function s2w(px,py){return [(px-W/2)/CAM.z+CAM.x,(py-H/2)/CAM.z+CAM.y]}
function tap(px,py){const [wx,wy]=s2w(px,py);for(const i of INC){if(i.bx!=null&&Math.hypot(wx-i.bx,wy-i.by)<24){incDlg(i);return}}let best=null;for(const h of HIT){if(wx>=h.x&&wx<=h.x+h.w&&wy>=h.y&&wy<=h.y+h.h)best=h}if(best)unitDlg(best.u);}

let AC=null,muted=true,hum=null;
function toggleSnd(){muted=!muted;$("snd").textContent=muted?"🔇":"🔊";if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),n=AC.createBiquadFilter(),g=AC.createGain();o.type="sawtooth";o.frequency.value=48;n.type="lowpass";n.frequency.value=180;g.gain.value=0;o.connect(n);n.connect(g);g.connect(AC.destination);o.start();hum=g;}catch(e){}}
 if(hum)hum.gain.value=muted?0:.035;}
function beep(f,d){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}

const PTR=new Map();let drag=null,pinch=null,moved=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);PTR.set(e.pointerId,[e.clientX,e.clientY]);moved=0;
 CT=null;if(PTR.size===1)drag={x:e.clientX,y:e.clientY,cx:CAM.x,cy:CAM.y};else if(PTR.size===2){const [a,b]=[...PTR.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:CAM.z};drag=null;}});
cv.addEventListener("pointermove",e=>{if(!PTR.has(e.pointerId))return;PTR.set(e.pointerId,[e.clientX,e.clientY]);
 if(pinch&&PTR.size===2){const [a,b]=[...PTR.values()];CAM.z=clamp(pinch.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d,.25,2.6);moved=99;}
 else if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));CAM.x=drag.cx-dx/CAM.z;CAM.y=drag.cy-dy/CAM.z;clampCam();}});
function endPtr(e){const was=PTR.size;PTR.delete(e.pointerId);if(PTR.size<2)pinch=null;if(was===1&&moved<7)tap(e.clientX,e.clientY);if(!PTR.size)drag=null;}
cv.addEventListener("pointerup",endPtr);cv.addEventListener("pointercancel",e=>{PTR.delete(e.pointerId);drag=null;pinch=null});
cv.addEventListener("wheel",e=>{e.preventDefault();CT=null;CAM.z=clamp(CAM.z*(e.deltaY<0?1.12:.89),.25,2.6)},{passive:false});
