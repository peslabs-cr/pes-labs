 if(G.nc.some(x=>/curado/.test(x.t)))L.push("💡 <b>Trabajo estándar:</b> sacaste piezas del UV antes de tiempo. Saltarse un paso no se ve… hasta que falla en el paciente.");
 if(G.nc.some(x=>/Rebaba/.test(x.t))||G.scrapGood)L.push(`🔍 <b>Inspección:</b> ${G.nc.some(x=>/Rebaba/.test(x.t))?"aceptaste piezas con rebaba":""}${G.nc.some(x=>/Rebaba/.test(x.t))&&G.scrapGood?" y ":""}${G.scrapGood?"rechazaste piezas buenas":""}. Cuando dudes, usa la lupa: medir antes de decidir.`);

 const sendR={turno:`Nivel ${G.lv} · ${LV.name}`,titulo:`Célula Limpia · ${LV.name}`,estrellas:st,margen:G.served,seg:Math.max(0,100-G.alarms*20-G.gownErr*5),conf:Math.round(sr*100),ok:G.served,bad:nc,ign:G.missed,meas:G.lupas||0};sendRes("celula",sendR,G.dec);
 const nxt=LEVELS[G.lv+1];openD(`<span class="tag">${LV.ic} Nivel ${G.lv} · ${LV.name}</span><h2>${"⭐".repeat(st)}${"☆".repeat(3-st)} ${tit}</h2>

 ${MODE==="line"?`<h3>⚙️ OEE de la línea: ${Math.round(oee*100)} %</h3><div class="data">Disponibilidad <b>${Math.round(avail*100)} %</b> × Rendimiento <b>${Math.round(perf*100)} %</b> × Calidad <b>${Math.round(qual*100)} %</b><br><span class="mut">Corrió ${Math.round(Ln.run)} s y estuvo parada ${Math.round(Ln.down)} s · ${Ln.good} sets buenos, ${Ln.bad} rechazados</span></div><h3>📊 Pareto de paros</h3>${Object.entries(Ln.why).sort((a,b)=>b[1]-a[1]).map(([w,t],i,a)=>`<div class="mut">${w} · ${Math.round(t)} s</div><div class="hb"><i style="width:${t/a[0][1]*100}%;background:${i?"#ffb020":"#d64532"}"></i></div>`).join("")||"<p class='mut'>¡Sin paros!</p>"}`:

 ${LV.prod==="guia"&&G.spc.length?`<h3>📈 Tu gráfico de control</h3><canvas id="spcc" width="640" height="220" style="width:100%;max-width:420px;border-radius:8px;border:1px solid var(--bd);background:#fff"></canvas>`:""}
 <h3>🍝 Tu diagrama de espagueti</h3><canvas id="spg" width="640" height="360" style="width:100%;max-width:420px;border-radius:8px;border:1px solid var(--bd);background:#f4f8fa"></canvas>

function drawSpc(){const c=$("spcc");if(!c)return;const g=c.getContext("2d");const pts=G.spc,n=pts.length;const Y=v=>200-(clamp(v,7,17)-7)/10*180;g.fillStyle="#fff";g.fillRect(0,0,640,220);
 const ln=(v,col,d)=>{g.strokeStyle=col;g.setLineDash(d||[]);g.lineWidth=2;g.beginPath();g.moveTo(40,Y(v));g.lineTo(630,Y(v));g.stroke();g.setLineDash([]);g.fillStyle=col;g.font="600 13px system-ui";g.fillText(v,6,Y(v)+4);};
 ln(9,"#d64532",[6,4]);ln(15,"#d64532",[6,4]);ln(10.2,"#e0a51c",[4,4]);ln(13.8,"#e0a51c",[4,4]);ln(12,"#1f9a55");
 g.strokeStyle="#2f6a95";g.lineWidth=2;g.beginPath();pts.forEach((v,i)=>{const x=40+i*590/Math.max(1,n-1);i?g.lineTo(x,Y(v)):g.moveTo(x,Y(v))});g.stroke();
 pts.forEach((v,i)=>{const x=40+i*590/Math.max(1,n-1);g.fillStyle=v<9||v>15?"#d64532":v<10.2||v>13.8?"#e0a51c":"#2f6a95";g.beginPath();g.arc(x,Y(v),4,0,7);g.fill();});
 g.fillStyle="#5d7581";g.font="600 13px system-ui";g.fillText("Espesor del recubrimiento (µm) · rojo: especificación · ámbar: límites de control",40,216);}
function drawSpg(){const c=$("spg");if(!c)return;const g=c.getContext("2d"),s=45,oy=-1.9*s;g.fillStyle="#f4f8fa";g.fillRect(0,0,640,440);
 for(const k in ST){const t=ST[k];g.fillStyle="#fff";g.strokeStyle=t.col;g.lineWidth=2;g.fillRect(t.x*s-32,t.y*s+oy-22,64,44);g.strokeRect(t.x*s-32,t.y*s+oy-22,64,44);g.font="22px system-ui";g.textAlign="center";g.fillText(t.ic,t.x*s,t.y*s+oy+8);}
 g.strokeStyle="rgba(214,69,50,.35)";g.lineWidth=1.6;g.beginPath();G.trail.forEach((q,i)=>i?g.lineTo(q[0]*s,q[1]*s+oy):g.moveTo(q[0]*s,q[1]*s+oy));g.stroke();
 g.fillStyle="#5d7581";g.font="600 15px system-ui";g.textAlign="left";g.fillText(`${Math.round(G.dist)} m caminados en el turno`,10,350);}

 <h3>Tu trabajo en la línea</h3><p>🛒 Surte los alimentadores desde los estantes del supermercado antes de que se vacíen · ⚠️ Destraba atascos (con bloqueo) · 🗑️ Vacía la bolsa de rechazos · 📦 Lleva cada caja a entrega · ♨️ Vigila la selladora</p><button class="btn" onclick="backD()">Entendido</button>`);

 ${PROC.map(k=>`<p><b>${ST[k].ic} ${ST[k].n}</b> <span class="mut">(${ST[k].tm} s${ST[k].batch?" · horno por lotes de hasta "+ST[k].cap:ST[k].mach?" · máquina: trabaja sola":" · manual: quédate en la estación"})</span><br>${ST[k].sop}</p>`).join("")}

function helpDlg(){openD(`<h2>🩺 Célula Limpia</h2><p>Fabricas dispositivos médicos en un área limpia. Afuera, los doctores llevan 30 horas de guardia y llegan como zombies: cada uno necesita su dispositivo para atender a un paciente. Cuando se lo das, despierta y corre al quirófano. Al final de cada nivel llega el 🧌 <b>Dr. Ogro</b>, jefe de cirugía, que pide 3 a la vez.</p>
 <ul style="font-size:14px;line-height:1.5"><li><b>Moverte:</b> toca una estación y caminas hasta ella. En computadora también puedes usar las flechas o WASD y la barra espaciadora (o E) para usar la estación más cercana.</li>
 <li><b>Manos:</b> llevas una cosa a la vez. En las <b>celdas</b>, las estaciones manuales avanzan solo si te quedas en ellas (al terminar, la pieza pasa sola a tus manos) y las máquinas trabajan solas. Si una máquina terminó y traes la pieza que sigue, se <b>intercambian</b> en un solo toque. El 🔥 <b>horno</b> trabaja por lotes: lo cargas y lo arrancas tocándolo con las manos libres.</li><li><b>👷 Equipo:</b> con tus ⭐ puedes contratar un operador para una estación, un surtidor de materiales o, en la línea, un técnico de mantenimiento. Cada uno cobra salario.</li><li><b>Línea:</b> la banda no para mientras tenga material. Tú surtes los alimentadores, destrabas ⚠️ atascos, vacías rechazos y llevas las cajas.</li>
 <li><b>🎯 Takt:</b> llega un doctor cada ${G.takt} s y su paciencia se agota. Puedes dejar hasta 3 en espera en la ventanilla.</li>
 <li><b>🌫️ Partículas:</b> suben al caminar, mucho más al 🏃 correr, y con lo que no sacaste en 5S. Si llegan al límite, la célula se detiene.</li>

 <p class="mut">Planta, procesos y datos genéricos con fines educativos, sin marcas reales. Creado por Ing. Ricardo Fonseca Pereira con ayuda de IA · PES Labs · CC BY-NC 4.0.</p><button class="btn" onclick="backD()">Entendido</button> <a class="btn o" href="../index.html#juegos">Volver a PES Labs</a>`);}
const LVLS=[[1,"Célula en U · Hemodinamia · 5S, takt, selladora y expediente del lote"],[2,"Célula + horno por lotes · Radiología, de noche · SPC y flujo contra lotes"],[3,"Línea automatizada · Emergencias · OEE, supermercado y Pareto de paros"],["🫀","Stent","Célula con microscopio · Cardiología"],["🔀","Cambio de producto","Despeje de línea entre lotes"],["🕵️","Día de auditoría","Todo el sistema de calidad"],["🧟","La gran guardia","Todos los productos a la vez"]];

 openD(`<span class="tag">PES Labs · Juego de manufactura de dispositivos médicos</span><h2>🩺 Célula Limpia</h2>
 <p>En el hospital, los doctores llevan <b>30 horas de guardia</b> y ya parecen zombies 🧟: arrastran los pies y solo repiten «catéteeer…». Lo único que los despierta es recibir a tiempo el dispositivo que necesita su paciente.</p>
 <p>Tú fabricas dispositivos médicos en un <b>área limpia</b>, primero en celdas y luego en una línea. Vístete bien, organiza con <b>5S</b>, verifica la <b>selladora</b>, sigue el <b>trabajo estándar</b> y produce al ritmo del <b>takt</b>. Del otro lado hay un paciente.</p>
